<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Кайдзен — задачи, события, напоминания</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --accent:#4f46e5;--accent-dark:#4338ca;--bg:#eef0f6;--panel:#ffffff;
  --text:#1e2233;--muted:#6b7280;--border:#e3e6ef;
  --danger:#e5484d;--ok:#16a34a;--warn:#d97706;
  --card:#ffffff;--chip-bg:#eef0f6;--block:#fafbff;--soft:#f3f4fa;--hover:#f5f6fd;
  --radius:10px;--shadow:0 1px 3px rgba(20,25,50,.08),0 4px 14px rgba(20,25,50,.06);
}
body[data-theme="dark"]{
  --bg:#13151d;--panel:#1b1e2c;--text:#e7e9f4;--muted:#98a0b8;
  --border:#2b3045;--danger:#f87171;--ok:#34d399;--warn:#fbbf24;
  --card:#212538;--chip-bg:#262b40;--block:#202439;--soft:#242a40;--hover:#252b44;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
body[data-theme="mac"]{
  --accent:#007aff;--accent-dark:#0062cc;--bg:#f5f5f7;--panel:#ffffff;
  --text:#1d1d1f;--muted:#86868b;--border:rgba(0,0,0,.08);
  --danger:#ff3b30;--ok:#34c759;--warn:#ff9500;
  --card:#ffffff;--chip-bg:#f2f2f7;--block:#fafafa;--soft:#f5f5f7;--hover:#ececf1;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body[data-theme="mac"] header{background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
body[data-theme="mac"] .sidebar{background:#fbfbfd}
body[data-theme="mac"] .org-head.active,body[data-theme="mac"] .project-item.active,body[data-theme="mac"] .all-item.active{background:#e8f0fe}
body[data-theme="mac"] .icon-btn.on{background:#e6f9ee;color:var(--ok)}
body[data-theme="mac"] .icon-btn.off{background:#ffe9e7;color:var(--danger)}
body[data-theme="linux"]{
  --accent:#f56b2e;--accent-dark:#d04816;--bg:#1f1c19;--panel:#2b2724;
  --text:#f7f2ec;--muted:#c0b8ab;--border:#57504a;
  --danger:#ff8f7d;--ok:#4ed98f;--warn:#ffc46b;
  --card:#403a34;--chip-bg:#37322d;--block:#312c28;--soft:#302b27;--hover:#3d3731;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}
body[data-theme="linux"] ::placeholder{color:#9a9184}
body[data-theme="linux"] .column{background:rgba(43,39,36,.62);box-shadow:0 1px 4px rgba(0,0,0,.4)}
body[data-theme="linux"] .card{background:var(--card)!important;box-shadow:0 1px 3px rgba(0,0,0,.45)}
body[data-theme="linux"] .chip{color:#e8e2da}
body[data-theme="linux"] .chip.done{background:#2c4637}
body[data-theme="linux"] .chip.overdue{background:#4a2f2b}
body[data-theme="linux"] .chip.today{background:#46392a}
body[data-theme="linux"] .chk{color:#e8e2da}
body[data-theme="linux"] .field label{color:#e8e2da}
body[data-theme="linux"] .lrow:hover{border-color:#5d564e}
body[data-theme="linux"] .cal-item.dl{background:#3d3324;border-color:#57492e}
body[data-theme="linux"] .cal-item.ev{background:#3c3429;border-color:#5a4d36}
body[data-theme="linux"] .report-table tr.ctx-head td{background:#3d3327;color:#f0e9e0}
body[data-theme="linux"] .report-table tr.total td{background:#3a3424}
body[data-theme="linux"] .btn.danger{background:#4a2f2b}
body[data-theme="linux"] .org-head.active,body[data-theme="linux"] .project-item.active,body[data-theme="linux"] .all-item.active{background:#4a3327}
body[data-theme="linux"] .icon-btn.on{background:#2c4637;color:var(--ok)}
body[data-theme="linux"] .icon-btn.off{background:#4a2f2b;color:var(--danger)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
body[data-theme="dark"] input,body[data-theme="dark"] select,body[data-theme="dark"] textarea{color-scheme:dark}

header{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:0 1px 4px rgba(20,25,50,.05);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.logo-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
nav.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;margin-left:6px}
nav.tabs button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button.active{background:var(--accent);color:#fff}
nav.tabs button:hover:not(.active){color:var(--text)}
.stats{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap}
.stat b{font-weight:600}.stat.danger b{color:var(--danger)}.stat.warn b{color:var(--warn)}.stat.running b{color:var(--warn)}
.spacer{flex:1}
.search-box{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 9px;width:200px;flex-shrink:0}
.search-box input{border:none;outline:none;background:transparent;width:100%}
.search-box svg{flex-shrink:0;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent;white-space:nowrap;flex-shrink:0}
.icon-btn:hover{background:var(--bg)}
.icon-btn.primary{background:var(--accent);color:#fff}
.icon-btn.primary:hover{background:var(--accent-dark)}
.icon-btn.on{background:#e8f7ee;color:var(--ok)}
body[data-theme="dark"] .icon-btn.on{background:#1c3b2a;color:var(--ok)}
.icon-btn.off{background:#fde8e8;color:var(--danger)}
body[data-theme="dark"] .icon-btn.off{background:#3a2226;color:var(--danger)}

.layout{display:flex;flex:1;min-height:0}
.sidebar{width:320px;min-width:320px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.sidebar-head span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.project-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.org-block{border:1px solid var(--border);border-radius:11px;background:var(--block);margin-bottom:10px;overflow:hidden}
.org-head{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer;position:relative;background:var(--panel)}
.org-head:hover{background:var(--hover)}
.org-head.active{background:#eef0ff}
body[data-theme="dark"] .org-head.active{background:#2a2f4a}
.org-head .twist{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-radius:4px}
.org-head .twist:hover{background:var(--soft);color:var(--text)}
.org-head .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.org-head .name{flex:1;min-width:0;font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.org-head .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px;flex-shrink:0}
.org-head .mini-actions{display:flex;gap:2px}
.org-children{padding:2px 0 6px;border-top:1px dashed var(--border)}
.project-item{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 26px;cursor:pointer;position:relative;flex-wrap:wrap}
.project-item:hover{background:var(--bg)}
.project-item.active{background:#eef0ff}
body[data-theme="dark"] .project-item.active{background:#2a2f4a}
.project-item .rail{position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--border);border-radius:2px}
.project-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.project-item .name{flex:1;min-width:0;font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.project-item .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px;flex-shrink:0}
.project-item .mini-actions{display:flex;gap:2px}
.pr-prog{flex:1 0 100%;display:flex;align-items:center;gap:7px;margin-top:5px;padding-left:18px}
.pr-prog-track{flex:1;height:4px;border-radius:3px;background:var(--bg);overflow:hidden}
.pr-prog-fill{height:100%;border-radius:3px;background:var(--accent)}
.pr-prog-num{font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0}
.all-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;margin-bottom:8px;border:1px solid transparent}
.all-item:hover{background:var(--bg)}
.all-item.active{background:#eef0ff;border-color:#d7dbfb}
body[data-theme="dark"] .all-item.active{background:#2a2f4a;border-color:#3a4162}
.all-item .name{flex:1;font-weight:700;font-size:13.5px}
.all-item .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
.mini{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;opacity:.85}
.mini:hover{background:var(--panel);color:var(--text);opacity:1}
.mini.danger:hover{color:var(--danger)}
.mini.dots{font-size:16px;font-weight:700;letter-spacing:1px;line-height:1}
.row-menu{position:fixed;z-index:120;display:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(20,25,50,.28);padding:5px;min-width:200px}
.row-menu.open{display:block}
.row-menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 11px;border:none;background:none;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);text-align:left}
.row-menu button:hover{background:var(--bg)}
.row-menu button svg{color:var(--accent);flex-shrink:0}
.row-menu button.danger{color:var(--danger)}
.row-menu button.danger svg{color:var(--danger)}
.row-menu hr{margin:4px 0;border:none;border-top:1px solid var(--border)}
.card-pct{display:flex;align-items:center;gap:7px;margin:8px 0 2px}
.pct-track{flex:1;height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.pct-bar{height:100%;border-radius:3px;background:var(--accent)}
.card-pct.done .pct-bar{background:#22c55e}
.pct-num{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.chip.pct{color:var(--accent);border-color:var(--accent)}
.ov-chip .ov-mini{display:inline-block;width:34px;height:5px;border-radius:3px;background:var(--bg);overflow:hidden;vertical-align:middle;margin-right:6px;position:relative;top:-1px}
.ov-chip .ov-mini span{display:block;height:100%;background:var(--accent);border-radius:3px}
.sidebar-foot{padding:10px 12px;border-top:1px solid var(--border)}
.sidebar-foot .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}

.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.tab-page{display:none;flex:1;min-height:0}
.tab-page.active{display:flex;flex-direction:column}
#tabPersonal{overflow:auto}
#tabBrain{overflow:auto}
#tabBoard{overflow:auto;padding:16px}
#tabToday{overflow:auto;padding:18px 22px}
#tabCalendar{overflow:auto;padding:18px 22px}
#tabReport{overflow:hidden}
#tabGantt{overflow:auto;padding:16px}
.gantt-box{border:1px solid var(--border);border-radius:10px;background:var(--card-bg);overflow:hidden}
.gantt-filters{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.gantt-scroll{overflow:auto;max-height:calc(100vh - 250px)}
.gantt-canvas{min-width:100%}
.gantt-row{display:flex;border-bottom:1px solid var(--border)}
.gantt-head .gantt-name-col{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.gantt-head{background:var(--panel)}
.gantt-name-col{position:sticky;left:0;z-index:3;background:var(--card-bg);border-right:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;font-weight:600;overflow:hidden;white-space:nowrap;flex-shrink:0}
.gantt-name-col .gantt-t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gantt-name-col .gantt-sub{font-size:10px;color:var(--muted);font-weight:400;flex-shrink:0}
.gantt-cells{display:flex;height:100%}
.gantt-cell{height:100%;border-left:1px solid var(--border);font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gantt-cell.wk{background:rgba(245,158,11,.06)}
.gantt-line{position:relative;border-left:1px solid var(--border);flex-shrink:0}
.gantt-bar{position:absolute;top:4px;height:18px;border-radius:5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;overflow:hidden}
.gantt-bar.done{background:linear-gradient(180deg,#34d399,#10b981)!important}
.gantt-bar.late{outline:2px solid var(--danger)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:2;pointer-events:none}
.gantt-today::before{content:'сегодня';position:absolute;top:2px;left:4px;font-size:9px;color:var(--danger);font-weight:700;white-space:nowrap}
.gantt-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
.gantt-hint{font-size:11.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--border);background:var(--panel)}
#tabDocs{overflow:hidden;padding:0}

.docs-wrap{display:flex;flex:1;min-height:0}
.docs-side{width:255px;min-width:255px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.docs-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.docs-head-title{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs-tree{flex:1;overflow:auto;padding:8px}
.docs-empty{font-size:12.5px;color:var(--muted);padding:18px 8px;text-align:center;line-height:1.55}
.doc-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);margin-bottom:2px}
.doc-item:hover{background:var(--bg2)}
.doc-item.active{background:var(--accent);color:#fff}
.doc-item.child{padding-left:26px;font-size:12.5px}
.doc-ic{color:var(--accent);display:flex;flex-shrink:0;width:15px;justify-content:center}
.doc-ti{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs-main{flex:1;overflow:auto;padding:22px 28px;min-width:0}
.docs-main .doc-empty{max-width:520px;margin:50px auto 0}
.doc-empty{text-align:center}
.doc-empty-icon{font-size:34px;color:var(--accent);margin-bottom:10px;display:flex;justify-content:center}
.doc-empty-title{font-size:17px;font-weight:700;margin-bottom:6px}
.doc-empty-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.doc-empty-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.doc-back{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:10px;display:inline-block}
.doc-back:hover{color:var(--accent)}
.doc-view h1{font-size:24px;margin:0 0 4px}
.doc-meta{font-size:12px;color:var(--muted);margin-bottom:16px}
.doc-content{max-width:860px;line-height:1.65;font-size:14.5px;overflow-wrap:break-word}
.doc-content h2{font-size:18px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.doc-content h3{font-size:15.5px;margin:18px 0 6px}
.doc-content p{margin:0 0 10px}
.doc-content ul{margin:0 0 12px;padding-left:20px}
.doc-content li{margin-bottom:3px}
.doc-content ul.todo{list-style:none;padding-left:2px}
.doc-content ul.todo li{position:relative;padding-left:22px}
.doc-content ul.todo li:before{content:'';position:absolute;left:0;top:3px;width:13px;height:13px;border:1.5px solid var(--muted);border-radius:4px}
.doc-content ul.todo li.done:before{background:var(--accent);border-color:var(--accent)}
.doc-content ul.todo li.done{color:var(--muted)}
.doc-content a{color:var(--accent);text-decoration:underline}
.doc-content a:hover{text-decoration:none}
.doc-nocontent{color:var(--muted);font-size:13.5px;padding:8px 0}
.doc-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:14px;border-top:1px solid var(--border)}
.doc-kids{margin-top:26px}
.doc-kids-head{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.doc-kid{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13.5px;background:var(--panel)}
.doc-kid:hover{border-color:var(--accent);color:var(--accent)}
.doc-kid svg{color:var(--accent)}
.doc-overview{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:14px 0 20px;background:var(--panel)}
.doc-overview-head{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--accent)}
.doc-overview-chips{display:flex;gap:6px;flex-wrap:wrap}
.ov-chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--text)}
.ov-chip b{font-weight:700}
.ov-chip.ov-bad{color:#fff;background:var(--danger);border-color:var(--danger)}
.ov-chip.ov-ok{color:#fff;background:#22c55e;border-color:#22c55e}
.doc-overview-acts{margin-top:10px}
.doc-overview-acts .btn{padding:5px 11px;font-size:12px}
.doc-all{padding-bottom:20px}
.doc-all-org{border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.doc-all-org-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--border);background:var(--bg2)}
.doc-all-org-head .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.doc-all-page{display:flex;align-items:center;gap:9px;padding:9px 14px 9px 34px;font-size:13.5px;cursor:pointer}
.doc-all-page:hover{background:var(--bg2);color:var(--accent)}
.doc-all-page svg{color:var(--accent);flex-shrink:0}
.doc-all-proj{padding:9px 14px 2px 24px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.doc-toolbar{display:flex;align-items:center;gap:5px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.doc-toolbar [data-f]{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.doc-toolbar [data-f]:hover{border-color:var(--accent);color:var(--accent)}
.doc-toolbar .spacer{flex:1}
.doc-editor{display:flex;flex-direction:column;min-height:340px;max-height:60vh}
.doc-editor textarea{flex:1;min-height:300px;border:none;resize:none;padding:14px 16px;font:13.5px/1.6 Consolas,monospace;background:var(--panel);color:var(--text);outline:none}
.doc-preview{flex:1;min-height:300px;overflow:auto;padding:14px 16px;line-height:1.6;font-size:14px;background:var(--panel)}
.doc-preview h2{font-size:17px;margin:0 0 8px}
.doc-preview p{margin:0 0 10px}
.doc-preview ul{margin:0 0 10px;padding-left:20px}
.doc-hint{font-size:11.5px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--border)}
.stage-row{display:flex;gap:6px;margin-bottom:6px}
.stage-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text);font-size:13px;outline:none}
.stage-row input:focus{border-color:var(--accent)}
.stage-row .log-del{width:30px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:6px}
.stage-row .log-del:hover{color:var(--danger)}
.f-lbl{font-weight:400;color:var(--muted);font-size:11.5px}
.doc-preview-tree{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg2);font-size:12.5px;line-height:2}
.doc-preview-tree .dpt-root{font-weight:700;display:flex;align-items:center;gap:7px}
.doc-preview-tree .dpt-child{padding-left:26px;display:flex;align-items:center;gap:7px;color:var(--muted)}
#tabNotes{overflow:auto;padding:18px 22px}
.notes-wrap{max-width:860px}
.notes-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.notes-head-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text)}
.notes-hint{font-size:12.5px;color:var(--muted)}
.notes-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note-card{border:1px solid var(--border);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(20,25,50,.04)}
.note-card.pinned{border-color:var(--accent)}
.note-head{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--bg2)}
.note-date{font-size:11px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-mini{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer;flex-shrink:0}
.note-mini:hover{background:var(--bg);color:var(--accent)}
.note-mini.pin-on{color:var(--accent)}
.note-mini.del:hover{color:var(--danger)}
.note-body{flex:1;display:flex;padding:0}
.note-body textarea{flex:1;min-height:110px;border:none;resize:vertical;padding:10px 12px;font-size:13.5px;line-height:1.55;background:var(--panel);color:var(--text);outline:none;font-family:inherit}
.note-empty{font-size:13px;color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}
.notes-foot{font-size:11.5px;color:var(--muted);margin-top:14px}
.input-mic{display:flex;gap:6px}
.input-mic input,.input-mic textarea{flex:1}
.mic-btn{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border);color:var(--accent);cursor:pointer}
.mic-btn:hover{border-color:var(--accent)}
.mic-btn.on{background:#fde8e8;border-color:var(--danger);color:var(--danger);animation:pulse 1s infinite}
@media(max-width:640px){ .notes-list{grid-template-columns:1fr} }
@media(max-width:900px){
  .docs-wrap{position:relative}
  .docs-side{width:100%;min-width:0}
  .docs-main{display:none;position:absolute;inset:0;background:var(--bg);z-index:5;padding:16px}
  .docs-wrap.page-open .docs-side{display:none}
  .docs-wrap.page-open .docs-main{display:block}
}

.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.board-title{font-size:18px;font-weight:700}
.board-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--accent);color:#fff}
.toolbar-select{padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);font-size:12.5px;font-weight:600;color:var(--muted);outline:none;max-width:180px}
.board{display:flex;gap:14px;align-items:flex-start;min-height:300px}
.column{width:306px;min-width:306px;max-width:306px;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
body[data-theme="dark"] .column{background:rgba(27,30,44,.6)}
.column-head{padding:11px 12px 9px;display:flex;align-items:center;gap:8px}
.column-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.column-head .col-name{font-weight:700;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.column-head .col-count{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:0 8px}
.column-head .add-card{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--accent);flex-shrink:0;box-shadow:0 2px 6px rgba(79,70,229,.35)}
.column-head .add-card:hover{filter:brightness(1.12)}
.column-head .add-card svg{width:15px;height:15px}
.column-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.column-body.drag-over{background:#eef0ff;border-radius:6px}
.add-col-btn{width:60px;min-width:60px;height:44px;border:1px dashed #c6cbe0;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;margin-top:28px}
.add-col-btn:hover{background:#eef0ff;color:var(--accent)}
.empty-col{padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px}

.card{border-radius:9px;padding:10px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(20,25,50,.06);transition:box-shadow .12s,transform .12s;position:relative;background:var(--card)}
body[data-theme="dark"] .card{background:var(--card)!important}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.dragging{opacity:.45}
.card .card-top{display:flex;align-items:flex-start;gap:6px}
.card .card-title{font-weight:600;font-size:13.5px;line-height:1.35;flex:1;word-break:break-word}
.card .card-del{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:none;align-items:center;justify-content:center;color:var(--muted)}
.card:hover .card-del{display:flex}
.card .card-del:hover{background:#fde8e8;color:var(--danger)}
.card .card-desc{font-size:12.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#3b4252;background:var(--chip-bg);border:1px solid var(--border);border-radius:7px;padding:2px 8px;max-width:100%}
.chip svg{color:var(--accent);flex-shrink:0}
body[data-theme="dark"] .chip{color:#d7dbf0}
.chip.done{color:var(--ok);background:#e8f7ee;border-color:#bce7cd}
body[data-theme="dark"] .chip.done{background:#1c3b2a;border-color:#2e6b46}
.chip.overdue{color:var(--danger);background:#fde8e8;border-color:#f5b5b5}
body[data-theme="dark"] .chip.overdue{background:#3a2226;border-color:#7c3a3a}
.chip.today{color:var(--warn);background:#fdf1dc;border-color:#f3d9a4}
body[data-theme="dark"] .chip.today{background:#3a3020;border-color:#6b5525}
.chip.running{color:var(--warn);background:#fdf1dc;border-color:#f3d9a4;animation:pulse 1.6s infinite}
.chip.proj{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.nb svg{color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.prog{margin-top:9px;display:flex;align-items:center;gap:8px;background:var(--chip-bg);border-radius:6px;padding:4px 8px}
.prog-track{flex:1;height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;background:var(--ok)}
.prog-bar.warn{background:var(--warn)}
.prog-bar.over{background:var(--danger)}
.prog .pt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card-timer{margin-top:9px;display:flex;align-items:center;gap:8px;background:var(--chip-bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px}
.card-timer .tt{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.card-timer .tt.running{color:var(--warn)}
.timer-btn{width:28px;height:28px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);color:var(--text)}
.timer-btn.start:hover{background:#e8f7ee;color:var(--ok)}
.timer-btn.stop:hover{background:#fde8e8;color:var(--danger)}
.card.running-card{animation:timerpulse 1s ease-in-out infinite;border:1.5px solid rgba(245,158,11,.55)}
.card.rep-done{border-left-color:#10b981!important;box-shadow:inset 0 0 0 1.5px #10b981}
.card.rep-pending{border-left-color:#ef4444!important;box-shadow:inset 0 0 0 1.5px rgba(239,68,68,.55)}
body[data-theme="dark"] .card.rep-done{box-shadow:inset 0 0 0 1.5px #34d399}
body[data-theme="dark"] .card.rep-pending{box-shadow:inset 0 0 0 1.5px rgba(248,113,113,.75)}
@keyframes timerpulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 0 6px rgba(245,158,11,.18)}}
.card.running-card .card-meta,.card.running-card .card-desc,.card.running-card .card-pct,.card.running-card .cli-block,.card.running-card .card-footer,.card.running-card .prog{display:none!important}
.card.running-card .card-timer{margin-top:4px;padding:10px 12px;background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.4)}
.card.running-card .tt{font-size:17px;font-weight:800;letter-spacing:.6px;color:var(--warn)}
.live-dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;flex-shrink:0;animation:pulse 1s infinite;box-shadow:0 0 6px rgba(245,158,11,.8)}
.card-footer{display:flex;align-items:center;margin-top:9px;gap:8px}
.card-footer .who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-footer .due{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.card-footer .due.overdue{color:var(--danger)}
.lrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(20,25,50,.04)}
.lrow:hover{border-color:#c3c9e8;box-shadow:var(--shadow)}
body[data-theme="dark"] .lrow:hover{border-color:#3a4162}
.lrow .l-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lrow .l-flag{display:flex;align-items:center;flex-shrink:0}
.lrow .l-main{flex:1;min-width:0}
.lrow .l-title{font-weight:600;font-size:13.5px;line-height:1.35;word-break:break-word}
.lrow.l-done .l-title{color:var(--muted);text-decoration:line-through}
.lrow .l-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.lrow .l-chips .chip{font-size:11.5px;padding:1px 7px}
.lrow .l-timer{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:150px;justify-content:flex-end}
.lrow .l-timer .tt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.lrow .l-timer .tt.running{color:var(--warn)}
.lrow .l-timer .timer-btn{width:26px;height:26px;border-radius:6px}
.lrow .l-who{font-size:12px;color:var(--muted);flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;padding:3px 2px;border-radius:5px;cursor:pointer}
.cli:hover{background:var(--soft)}
.cli .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.cli .cb svg{width:10px;height:10px}
.cli.done .cb{background:var(--ok);border-color:var(--ok)}
.cli.done .ct{text-decoration:line-through;color:var(--muted)}
.cli-block{margin-top:8px}
.cli-block .cl-title{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}

.today-grid{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.today-col{flex:1;min-width:330px;max-width:560px}
.today-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:10px}
.today-head .badge{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-weight:600}
.today-head .badge.b-danger{color:var(--danger);background:#fde8e8}
.today-head .badge.b-warn{color:var(--warn);background:#fdf1dc}
.today-list{border:1px solid var(--border);border-radius:11px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.tday{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.tday:last-child{border-bottom:none}
.tday:hover{background:var(--hover)}
.tday .td-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tday .td-time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;flex-shrink:0}
.tday .td-time.danger{color:var(--danger)}
.tday .td-main{flex:1;min-width:0}
.tday .td-title{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tday .td-sub{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tday.overdue .td-title{color:var(--danger)}
.today-empty{color:var(--muted);font-size:13px;padding:18px;text-align:center}

.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:18px;font-weight:700}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--text)}
.cal-nav button:hover{background:var(--bg)}
.cal-nav button.cal-title{width:auto;padding:0 12px;font-size:14px;font-weight:700;min-width:150px}
.cal-mode{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.cal-mode button{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cal-mode button.active{background:var(--accent);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid.week{grid-template-columns:repeat(7,1fr)}
.cal-wd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0}
.cal-cell{background:var(--panel);border:1px solid var(--border);border-radius:9px;min-height:104px;padding:6px;cursor:pointer;position:relative;overflow:hidden}
.cal-cell:hover{border-color:#c3c9e8}
.cal-cell.today{border:2px solid var(--accent)}
.cal-cell.other{opacity:.45}
.cal-cell.drag-over{background:#eef0ff;border-color:var(--accent)}
.cal-cell .cn{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cal-cell.today .cn{color:var(--accent)}
.cal-item{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 5px;border-radius:5px;margin-bottom:2px;overflow:hidden;white-space:nowrap;cursor:grab}
.cal-item:hover{background:var(--soft)}
.cal-item .i-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-item .i-t{font-weight:700;flex-shrink:0;color:var(--muted)}
.cal-item .i-x{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-item.done{opacity:.5;text-decoration:line-through}
.cal-item.dl{background:#fff8ee;border:1px solid #f0dcae}
body[data-theme="dark"] .cal-item.dl{background:#33291a;border-color:#4a3c22}
.cal-item.ev{background:#f0f2ff;border:1px solid #d7dbfb}
body[data-theme="dark"] .cal-item.ev{background:#222a4a;border-color:#333c66}
.cal-more{font-size:11.5px;color:var(--muted);padding:2px 5px}
.cal-week-cell{background:var(--panel);border:1px solid var(--border);border-radius:9px;min-height:140px;padding:6px;cursor:pointer;overflow:hidden}
.cal-week-cell:hover{border-color:#c3c9e8}
.cal-week-cell.today{border:2px solid var(--accent)}
.cal-week-cell.drag-over{background:#eef0ff;border-color:var(--accent)}
.cal-day-list{max-width:720px}
.cal-day-list .drow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.cal-day-list .drow:hover{background:var(--hover)}
.cal-day-list .drow:first-child{border-radius:9px 9px 0 0}
.cal-day-list .drow:last-child{border-radius:0 0 9px 9px;border-bottom:none}

.report-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
.report-bar h2{font-size:16px;margin-right:6px}
.report-bar .f-lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.report-bar input[type=date],.report-bar select{padding:6px 9px;border:1px solid var(--border);border-radius:7px;outline:none;background:var(--panel)}
.report-bar select{max-width:200px}
.preset-btn{padding:6px 10px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--muted)}
.preset-btn:hover{background:var(--soft)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#3b4252;cursor:pointer}
body[data-theme="dark"] .chk{color:#d7dbf0}
.report-body{flex:1;overflow:auto;padding:18px 22px}
.report-summary{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.rs{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg);font-size:13px}
.rs b{font-size:15px}
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th{position:sticky;top:0;background:var(--soft);text-align:left;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);z-index:1}
.report-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.report-table td.num,.report-table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.report-table tr.ctx-head td{background:#eef0ff;font-weight:700;padding:7px 10px;border-top:2px solid var(--accent);border-bottom:none;color:#333a55}
body[data-theme="dark"] .report-table tr.ctx-head td{background:#2a2f4a;color:#d7dbf0}
.report-table tr.total td{background:#fbf7ea;font-weight:700;border-top:2px solid var(--warn);font-variant-numeric:tabular-nums}
body[data-theme="dark"] .report-table tr.total td{background:#33301f}
.report-table .t-title{font-weight:600}
.report-table .rep-cmt{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#4caf50;background:#e8f5e9;border:1px solid #b9e4c0;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
body[data-theme="dark"] .report-table .rep-cmt{background:#1d3322;color:#7dd08a;border-color:#2e5a38}
.report-table .t-desc{color:var(--muted);font-size:12px;margin-top:2px}
.report-table .t-resp{white-space:nowrap}
.report-empty{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.charts{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.chart{flex:1;min-width:300px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.chart h4{font-size:13px;font-weight:700;margin-bottom:10px}
.crow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.crow .cl{min-width:110px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.crow .ctr{flex:1;background:var(--soft);border-radius:4px;height:16px;position:relative;overflow:hidden}
.crow .cbar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
.crow .cv{min-width:74px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}

.modal-overlay{position:fixed;inset:0;background:rgba(20,25,50,.5);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(20,25,50,.3);width:100%;max-width:680px;animation:pop .15s ease-out}
.modal.game-full{width:97vw;max-width:97vw;height:96vh;max-height:96vh}
.modal.game-full .modal-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal.game-full canvas{max-width:100%;max-height:100%;width:auto;height:auto}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head .h3sub{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.modal-head h3{font-size:15.5px}
.modal-head .h3sub{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:18px 20px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.help-body{max-width:640px}
.help-sec{margin-bottom:18px}
.help-sec h4{font-size:13.5px;margin-bottom:6px;color:var(--accent);display:flex;align-items:center;gap:6px}
.help-sec p,.help-sec li{font-size:13px;line-height:1.55}
.help-sec ul{margin:6px 0 0 18px;display:grid;gap:3px}
.help-sec b{font-weight:600}
.help-kbd{display:inline-block;background:var(--soft);border:1px solid var(--border);border-radius:5px;padding:0 6px;font-size:12px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#3b4252;margin-bottom:6px}
body[data-theme="dark"] .field label{color:#d7dbf0}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=datetime-local],.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--card)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field textarea{resize:vertical;min-height:64px}
.field .row{display:flex;gap:12px}
.field .row>div{flex:1}
.field-ctx-label{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:9px 12px}
.field-hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fde8e8;color:var(--danger)}
.btn.danger:hover{background:#fbd3d4}
body[data-theme="dark"] .btn.danger{background:#3a2226}
.log-block{margin-top:6px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.log-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
.log-row:last-child{border-bottom:none}
.log-row .log-note{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-row .log-dur{font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.log-row .log-del{color:var(--muted);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.log-row .log-del:hover{background:#fde8e8;color:var(--danger)}
.log-empty{padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
.col-rows{padding:4px 0}
.col-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.col-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--card)}
.col-row input:focus{border-color:var(--accent)}
.col-row .mini{flex-shrink:0}
.add-inline{display:flex;gap:8px;margin-top:8px}
.add-inline input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--card)}
.add-inline input:focus{border-color:var(--accent)}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
.att-row:last-child{border-bottom:none}
.att-row .att-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);text-decoration:none}
.att-row .att-name:hover{text-decoration:underline}
.att-row .att-size{color:var(--muted);font-size:12px}
.cmt{padding:8px 0;border-bottom:1px dashed var(--border)}
.cmt:last-child{border-bottom:none}
.cmt .cmt-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cmt .cmt-author{font-weight:700;color:var(--text)}
.cmt .cmt-text{font-size:13.5px;margin-top:3px;white-space:pre-wrap}
.cmt-del{margin-left:auto;color:var(--muted);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.cmt-del:hover{background:#fde8e8;color:var(--danger)}

.banners{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(560px,92vw)}
.banner{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:5px solid #fbbf24;animation:slideIn .25s ease-out,bannerShake 1.1s ease-in-out .4s 4,bannerGlow 2s ease-in-out 3s infinite}
@keyframes bannerShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes bannerGlow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}50%{box-shadow:0 0 26px 8px rgba(251,191,36,.35)}}
.banner .b-icon{width:34px;height:34px;border-radius:9px;background:#fdf1dc;color:var(--warn);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:pulse 1.2s infinite}
.banner .b-title{font-weight:700;font-size:13.5px}
.banner .b-text{font-size:12.5px;color:#e4e7ff;margin-top:2px}
.b-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.b-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.b-btn.primary{background:#fff;color:#4f46e5;border-color:transparent}
.b-btn.danger{background:rgba(239,68,68,.9);border-color:transparent}
.b-btn:hover{filter:brightness(1.12)}
.b-snooze{display:none;background:#fff;color:#1e2233;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:600;border:none;outline:none;cursor:pointer}
.modal.evt-mode .evt-hide{display:none!important}
.modal.rep-mode .rep-hide{display:none!important}
.chip.evt{color:#4338ca;background:#e0e4ff;border-color:#9ca9f8}
.chip.rep{color:#92400e;background:#ffead1;border-color:#f2b06b}
.chip.nb{color:var(--muted);background:var(--soft);border-style:dashed}
body[data-theme="dark"] .chip.evt{color:#c7cdfb;background:#2b3160;border-color:#5560e8}
body[data-theme="dark"] .chip.rep{color:#fbd38d;background:#40331c;border-color:#b45309}
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toasts{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#1e2233;color:#fff;border-radius:9px;padding:11px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s ease-out;max-width:340px}
.toast.error{background:#c0392b}.toast.ok{background:#1e7f4f}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9cee0;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aab0c8}
::-webkit-scrollbar-track{background:transparent}

/* ============ мобильная адаптация ============ */
.btn-burger{display:none}
@media (max-width:900px){
  header{flex-wrap:wrap;height:auto;min-height:56px;padding:8px 10px;gap:6px 8px}
  nav.tabs{order:10;width:100%;max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-left:0}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex-shrink:0;padding:8px 14px;font-size:14px}
  .stats{display:none}
  .search-box{width:auto;flex:1;min-width:120px}
  .spacer{display:none}
  .icon-btn{padding:9px;font-size:0;min-width:44px;min-height:44px;justify-content:center}
  .icon-btn svg{width:19px;height:19px}
  .btn-burger{display:inline-flex!important}
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:70;width:min(320px,86vw);transform:translateX(-103%);transition:transform .22s ease;box-shadow:0 0 44px rgba(10,15,40,.35)}
  body.sb-open .sidebar{transform:none}
  body.sb-open::after{content:'';position:fixed;inset:0;background:rgba(20,25,50,.45);z-index:65}
  .board{display:block;padding-bottom:10px}
  .column{min-width:0;width:100%;max-width:100%;margin-bottom:14px;max-height:none;scroll-snap-align:none}
  .column-body{max-height:none;overflow:visible;overscroll-behavior:contain}
  .card .card-title{font-size:15px}
  .card .card-desc{font-size:13px;line-height:1.45}
  .card .card-del{display:flex;width:30px;height:30px}
  .chip{font-size:12.5px;padding:4px 9px;border-radius:7px}
  .cli{min-height:36px;align-items:center;font-size:13.5px}
  .today-col{min-width:0;max-width:none}
  .cal-grid{gap:3px}
  .cal-cell{min-height:58px;padding:4px;border-radius:7px}
  .cal-cell .cn{font-size:11px;margin-bottom:2px}
  .cal-item{font-size:10.5px;padding:2px 3px;border-radius:4px}
  .cal-cell .i-t,.cal-week-cell .i-t{display:none}
  .cal-week-cell{min-height:100px}
  .cal-head{gap:8px}
  .report-bar{flex-wrap:wrap;padding:10px 12px}
  .report-bar h2{width:100%}
  .report-bar input[type=date]{flex:1;min-width:120px}
  .report-bar select{max-width:none;flex:1;min-width:150px}
  .report-body{padding:12px 10px}
  .report-table{font-size:12px}
  .report-table th,.report-table td{padding:7px 8px}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:94vh;max-height:94dvh}
  .modal-head{padding:14px 16px}
  .modal-body{padding:16px;max-height:calc(94vh - 58px);max-height:calc(94dvh - 58px)}
  #tabBoard{padding:12px}
  #tabToday,#tabCalendar{padding:12px}
  .board-toolbar{gap:8px}
  .board-toolbar select{max-width:100%}
  .seg{overflow-x:auto;max-width:100%}
}
@media (max-width:520px){
  .logo span{display:none}
}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-report header,body.print-report .sidebar{display:none!important}
  body.print-report .layout{display:block!important;overflow:visible;height:auto}
  body.print-report .main-area{display:block!important;overflow:visible;height:auto}
  body.print-report #tabReport{display:block!important;overflow:visible;height:auto}
  body.print-report .report-body{overflow:visible;height:auto;padding:8mm 10mm}
  .report-bar .no-print,.charts .no-print{display:none!important}
  .report-table th{position:static}
}
.personal-wrap{max-width:840px;margin:0 auto;padding:16px;display:grid;gap:14px}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(20,25,50,.06)}
.p-card-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:12px}
.p-card-head svg{color:var(--accent)}
.pomo-btn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:none;cursor:pointer;flex-shrink:0;padding:0}
.pomo-btn:hover{opacity:.85}
.pomo-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.pomo-ring{position:relative;width:170px;height:170px;flex-shrink:0}
.pomo-ring svg{transform:rotate(-90deg)}
.pomo-ring .pomo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.pomo-mode{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.pomo-dots{display:flex;gap:5px;margin-top:8px}
.pomo-dots i{width:9px;height:9px;border-radius:50%;background:var(--border);border:1px solid var(--muted)}
.pomo-dots i.on{background:var(--accent);border-color:var(--accent)}
.pomo-side{flex:1;min-width:250px}
.pomo-controls{display:flex;gap:8px;flex-wrap:wrap}
.pomo-focus-task{display:flex;align-items:center;gap:8px;background:#eef0ff;border:1px solid #c9cdf5;border-radius:8px;padding:7px 10px;font-size:12.5px;margin-bottom:10px}
body[data-theme="dark"] .pomo-focus-task{background:#22284a;border-color:#39406e}
.pomo-settings{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:end}
.pomo-settings .field{width:92px}
.pomo-settings .field label{font-size:11px}
.pomo-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pomo-stat{background:#f3f4fb;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px}
body[data-theme="dark"] .pomo-stat{background:#1c2036}
.pomo-week{display:flex;align-items:end;gap:6px;height:74px;margin-top:12px}
.pomo-week .pw-bar{width:24px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#6366f1,#8b5cf6);position:relative;min-height:4px}
.pomo-week .pw-bar b{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text);font-weight:700}
.pomo-week .pw-bar span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.water-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.water-glass{width:64px;height:112px;border:3px solid var(--muted);border-top:none;border-radius:0 0 16px 16px;position:relative;overflow:hidden;flex-shrink:0;background:rgba(56,189,248,.06)}
.water-glass .wg-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#7dd3fc,#0ea5e9);opacity:.85;transition:height .5s}
.water-glass .wg-mark{position:absolute;left:0;right:0;border-top:1px dashed rgba(100,116,139,.45)}
.water-side{flex:1;min-width:250px}
.water-today{font-size:14px;margin-bottom:8px}
.water-bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px}
.water-bar div{height:100%;background:linear-gradient(90deg,#38bdf8,#0ea5e9);border-radius:6px;transition:width .4s}
.water-btns{display:flex;gap:6px;flex-wrap:wrap}
.water-settings{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:10px}
.water-settings .field{width:100px}
.med-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f8f9fd;border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px}
body[data-theme="dark"] .med-item{background:#1a1e33}
.med-item.off{opacity:.55}
.med-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.med-dose{font-weight:500;color:var(--muted);font-size:12px}
.med-note{flex-basis:100%;font-size:12px;color:var(--muted);line-height:1.45}
.med-times{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.med-time{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:7px;padding:3px 8px}
body[data-theme="dark"] .med-time{background:#232944}
.med-time.done{background:#e6f8ef;border-color:#86d9b2;color:#0f9d63}
.med-time.overdue{background:#fdeeef;border-color:#f0a3a3;color:#d33}
.med-take,.med-x{width:19px;height:19px;border-radius:50%;color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.med-take{background:var(--ok)}
.med-x{background:var(--muted)}
.med-empty{color:var(--muted);font-size:13px;padding:8px 0}
.move-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.move-exs{display:grid;gap:6px}
.move-ex{display:flex;align-items:center;gap:10px;background:#f8f9fd;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px}
body[data-theme="dark"] .move-ex{background:#1a1e33}
.move-ex.done{background:#e6f8ef;border-color:#86d9b2}
body[data-theme="dark"] .move-ex.done{background:#10331f;border-color:#1e6b3c}
.move-ex.done span{color:#0f7a3d}
body[data-theme="dark"] .move-ex.done span{color:#4ade80}
.btn.done{background:#10b981;border-color:#0f9d63;color:#fff}
.btn.done:hover{background:#0f9d63}
.move-ex span{flex:1;min-width:0}
.btn.timer{background:#0ea5e9;border-color:#0284c7;color:#fff}
.btn.timer:hover{background:#0284c7}
.btn.timer.on{animation:bannerShake 1s ease-in-out .3s 3}
.pomo-focus-task.move-tip{background:#e6f8ef;border-color:#86d9b2}
body[data-theme="dark"] .pomo-focus-task.move-tip{background:#10331f;border-color:#1e6b3c}
body[data-theme="linux"] .pomo-focus-task.move-tip{background:#2c4637;border-color:#4a7a58}
.br-circle{width:150px;height:150px;border-radius:50%;border:5px solid #10b981;margin:8px auto 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .3s}
.br-phase{font-weight:800;font-size:15px}
.br-time{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.br-rounds{font-size:12.5px;color:var(--muted)}
.sensei-fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:#fff;box-shadow:0 4px 14px rgba(20,25,50,.25);display:flex;align-items:center;justify-content:center;z-index:90;padding:0;transition:transform .15s}
.sensei-fab:hover{transform:scale(1.07)}
.sensei-fab svg{width:40px;height:40px}
.sensei-bubble{position:fixed;right:18px;bottom:86px;width:300px;max-width:calc(100vw - 40px);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 28px rgba(20,25,50,.22);padding:12px 12px 12px 14px;display:none;z-index:91;align-items:flex-start;gap:10px}
.sensei-bubble.show{display:flex;animation:senseiIn .25s ease}
.sensei-bubble.praise{border-color:#86d9b2}
.sensei-bubble .sensei-face{flex-shrink:0}
.sensei-bubble .sensei-text{flex:1;font-size:13px;line-height:1.45}
.sensei-bubble .sensei-x{background:none;border:none;cursor:pointer;color:var(--muted);padding:0;display:flex}
@keyframes senseiIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sensei-modal-quote{font-size:15px;font-weight:600;line-height:1.5;margin-top:12px}
.sensei-set{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sensei-bigface{flex-shrink:0}
.sensei-states,.sensei-opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;align-items:end}
.habit{display:flex;align-items:center;gap:10px;background:#f8f9fd;border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px}
body[data-theme="dark"] .habit{background:#1a1e33}
.habit.done{background:#e6f8ef;border-color:#86d9b2}
.habit-cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0}
.habit-cb.on{background:var(--ok);border-color:var(--ok)}
.habit-name{flex:1;min-width:0;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.habit-auto{font-size:10.5px;font-weight:600;color:#0f9d63;background:#dff5e9;border-radius:5px;padding:1px 6px}
body[data-theme="dark"] .habit-auto{background:#1d3322;color:#7dd08a}
.habit-streak{font-size:12px;color:var(--muted);white-space:nowrap}
.digest-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:10px}
.digest-genres{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dg-chip{font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:16px;padding:3px 10px;cursor:pointer;background:var(--bg);color:var(--muted)}
.dg-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.digest-status{font-size:12px;color:var(--muted)}
.dig-plan{display:flex;flex-direction:column;gap:10px}
.dig-plan-sec{background:#f8f9fd;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
body[data-theme="dark"] .dig-plan-sec{background:#1a1e33}
.dig-plan-title{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dp-cnt{display:inline-block;min-width:20px;text-align:center;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 5px}
.dig-plan-sec ul{margin:4px 0 0;padding-left:18px}
.dig-plan-sec li{font-size:13px;margin:3px 0}
.digest-note{font-size:12.5px;color:var(--muted)}
.dig-sec{margin-top:14px}
.dig-sec-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dig-weather{display:flex;flex-direction:column;gap:10px}
.dw-now{display:flex;flex-direction:column;gap:2px}
.dw-now b{font-size:26px}
.dw-now span{font-size:12.5px;color:var(--muted)}
.dw-days{display:flex;gap:10px}
.dw-days>div{flex:1;background:#f8f9fd;border:1px solid var(--border);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:2px;text-align:center}
body[data-theme="dark"] .dw-days>div{background:#1a1e33}
.dw-days b{font-size:12px}
.dw-days span{font-size:11.5px;color:var(--muted)}
.dig-genre{background:#f8f9fd;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
body[data-theme="dark"] .dig-genre{background:#1a1e33}
.dig-genre>ul{margin:6px 0 0;padding-left:18px}
.dig-genre li{font-size:13px;margin:4px 0}
.dig-genre a{color:var(--text);text-decoration:none}
.dig-genre a:hover{color:var(--accent);text-decoration:underline}
.sensei-tip{display:flex;gap:10px;align-items:center;background:#e6f8ef;border:1px solid #86d9b2;border-radius:10px;padding:10px 12px;font-size:13px;color:#0f5132}
body[data-theme="dark"] .sensei-tip{background:#14281d;border-color:#2f6b4a;color:#c9e8d8}
.lurv-chip{font-weight:700}
.lurv-chip[data-l="0"]{color:#64748b}
.lurv-chip[data-l="1"]{color:#0ea5e9}
.lurv-chip[data-l="2"]{color:#f59e0b}
.lurv-chip[data-l="3"]{color:#0f9d63}
.brain-wrap{display:flex;flex-direction:column;gap:14px}
.tongue-bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.tongue-view{height:400px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 25%,#4a1d63 0%,#2c1038 45%,#18081f 100%);border:1px solid var(--border);border-radius:10px;margin:10px 0}
.tongue-view::before,.tongue-view::after{content:'';position:absolute;top:0;bottom:0;width:110px;z-index:2;background:linear-gradient(90deg,#a11d2f,#7f1424 70%,#5c0f1b);box-shadow:0 0 18px rgba(0,0,0,.45)}
.tongue-view::before{left:0;clip-path:polygon(0 0,100% 0,100% 78%,86% 88%,70% 78%,54% 90%,38% 78%,22% 90%,8% 78%,0 88%)}
.tongue-view::after{right:0;clip-path:polygon(0 0,100% 0,100% 88%,92% 78%,78% 90%,62% 78%,46% 90%,30% 78%,14% 88%,0 78%)}
.tongue-run{position:absolute;left:0;right:0;bottom:0;transform:translate3d(0,0,0);will-change:transform;white-space:pre-wrap;font-size:20px;font-weight:600;line-height:1.5;text-align:center;padding:0 130px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);z-index:1}
.tongue-mic{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:52px;height:120px;z-index:3;pointer-events:none;opacity:.95}
.tongue-mic::before{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:6px;height:72px;background:linear-gradient(90deg,#2f2f35,#5a5a63 40%,#26262b);border-radius:3px}
.tongue-mic::after{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:34px;height:52px;border-radius:50% 50% 46% 46%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 7px),radial-gradient(circle at 50% 32%,#d6d6dc,#71717a 66%,#3f3f46);box-shadow:inset 0 -9px 16px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.5)}
.tongue-level{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;font-size:11.5px;font-weight:700;padding:2px 8px}
.tongue-prog{font-size:12.5px;color:var(--muted)}
.tongue-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tongue-ctrl input[type=range]{flex:1;min-width:140px}
.tongue-speed-lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.tongue-ask{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:rgba(59,130,246,.08);border:1px solid var(--accent);border-radius:10px;margin:6px 0;font-size:14.5px;font-weight:600;color:var(--text)}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bg-card{background:#f8f9fd;border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
body[data-theme="dark"] .bg-card{background:#1a1e33}
.bg-card h4{margin:0;font-size:13.5px}
.bg-card p{margin:0;font-size:12.5px;color:var(--muted);flex:1}
.bg-card .bg-score{font-size:12px;font-weight:600}
.brain-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.brain-stats b{color:var(--text)}
.bg-big{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.bg-example{font-size:30px;font-weight:700;text-align:center;margin:14px 0;font-variant-numeric:tabular-nums}
.duck-hud{display:flex;gap:16px;justify-content:center;font-size:14px;margin-bottom:8px}
.sol-board{background:linear-gradient(180deg,#0b7a5c,#096b50);border-radius:10px;padding:12px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.2)}
.sol-top{display:flex;gap:10px;align-items:flex-start;justify-content:flex-start;margin-bottom:12px;min-height:96px}
.win-card{width:64px;height:88px;border-radius:6px;background:#fff;border:1px solid #b6b6b6;box-shadow:0 1px 3px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;position:relative;cursor:pointer;user-select:none;color:#1a1a1a;font-size:15px;line-height:1.2}
.win-card.red{color:#c70000}
.win-card.up{cursor:grab}
.win-card.up:active{cursor:grabbing}
.win-card.down{background:repeating-linear-gradient(45deg,#1e4fd8 0 6px,#1a43b8 6px 12px);border-color:#12308a;color:#dbe6ff}
.win-back{font-size:20px}
.win-card.sel{outline:3px solid #f5c542;outline-offset:-2px}
.sol-stock,.sol-waste,.sol-base{width:64px;height:88px}
.sol-waste,.sol-base{display:flex;align-items:center;justify-content:center;position:relative}
.sol-base-sym{font-size:26px;color:rgba(255,255,255,.75);font-weight:700}
.sol-stock{position:relative}
.sol-slot{position:absolute;left:0;width:64px;height:88px;border:1.5px dashed rgba(255,255,255,.55);border-radius:6px;box-sizing:border-box}
.sol-cols{display:flex;gap:10px;justify-content:flex-start;overflow:visible;padding-bottom:6px;min-height:112px}
.sol-col{width:64px;position:relative}
.sol-wrap{width:64px;height:88px;position:absolute;left:0}
</style>
</head>

<script>
/* ============================================================ helpers */
const LS_KEY='kanban_board_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtDate=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};
const fmtT=iso=>{const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});};
const fmtDT=iso=>{const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
const dayKeyOf=iso=>iso?iso.slice(0,10):'';
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
  if(h)return h+'ч '+pad(m)+'м'; if(m)return m+'м'; return sec+'с';
}
function fmtHMS(sec){
  sec=Math.max(0,Math.floor(sec));
  return pad(Math.floor(sec/3600))+':'+pad(Math.floor((sec%3600)/60))+':'+pad(sec%60);
}
const ICON={
  plus:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  user:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>',
  clock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  calendar:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  bell:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',

function stageTemplateFor(stage){
  const n=String(stage||'').toLowerCase();
  if(n.includes('инициац'))return DOC_TEMPLATES.stage_init.content;
  if(n.includes('план'))return DOC_TEMPLATES.stage_plan.content;
  if(n.includes('исполн'))return DOC_TEMPLATES.stage_exec.content;
  if(n.includes('контрол'))return DOC_TEMPLATES.stage_ctl.content;
  if(n.includes('заверш'))return DOC_TEMPLATES.stage_fin.content;
  return '## '+String(stage||'Этап')+'\n\n';
}

function taskPct(t){
  const subs=allTasks().filter(s=>s.parentId===t.id);
  if(!subs.length)return isDone(t)?100:0;
  return Math.round(subs.reduce((s,x)=>s+(isDone(x)?100:0),0)/subs.length);
}
function ctxPct(c){
  const tasks=ctxTasks(c).filter(t=>!t.parentId);
  if(!tasks.length)return null;

}
function projPct(p){
  const roots=p.tasks.filter(t=>!t.parentId);

function playTone(freq,delay,dur){
  const ctx=audioCtx;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=freq;
  const t0=ctx.currentTime+delay;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.2,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.18));
  o.connect(g);g.connect(ctx.destination);
  o.start(t0);o.stop(t0+(dur||0.18)+0.05);
}

    const pat=SOUND_PATTERNS[type]||SOUND_PATTERNS[state.settings.soundType||'classic']||SOUND_PATTERNS.classic;
    pat.forEach(([f,d])=>playTone(f,d));

}

function dismissReminder(job){
  if(job.personal){
    if(job.personal==='water')state.notif.water={d:todayISO(),at:0};
    else if(job.personal==='move')state.notif.move={d:todayISO(),at:0};
    else if(job.personal==='digest')state.notif['digest']='d';
    else state.notif[job.key]='d';
    save();
    return;
  }
  const ref=job.ctxKey&&job.tid?findTaskRef(job.tid,job.ctxKey):null;
  if(ref&&ref.t){ if(!ref.t.notified)ref.t.notified={}; ref.t.notified[job.key]='d'; save(); }
}
function snoozeReminder(job,min){
  if(job.personal){
    const m=min==='tomorrow'?1440:(parseInt(min,10)||15);
    const at=Date.now()+m*60000;
    if(job.personal==='water')state.notif.water={d:todayISO(),at};
    else if(job.personal==='move')state.notif.move={d:todayISO(),at};
    else if(job.personal==='digest'){ state.notif['digest']=at; state.digest.last=''; }
    else state.notif[job.key]=at;
    save();
    toast(min==='tomorrow'?'Напомню завтра в 9:00':'Напомню через '+m+' мин');
    return;
  }
  const ref=job.ctxKey&&job.tid?findTaskRef(job.tid,job.ctxKey):null;
  if(!ref||!ref.t)return;
  if(!ref.t.notified)ref.t.notified={};
  if(min==='tomorrow'){
    const d=new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
    ref.t.notified[job.key]=d.getTime();
    toast('Напомню завтра в 9:00');
  } else {
    const m=parseInt(min,10)||15;
    ref.t.notified[job.key]=Date.now()+m*60000;
    toast('Напомню через '+m+' мин');
  }
  save();
}

/* ============================================================ reminders */
function nextRemindersOf(t){
  const now=Date.now();
  const list=[];
  if(t.dueDateTime){ const dt=new Date(t.dueDateTime).getTime(); if(isFinite(dt)&&t.reminder)list.push({at:dt-t.reminder*60000,when:dt,label:'Событие: '+t.title,sub:fmtDT(t.dueDateTime)}); }
  if(t.deadline){ const dl=new Date(t.deadline+'T23:59:59').getTime(); if(isFinite(dl)&&t.reminder)list.push({at:dl-t.reminder*60000,when:dl,label:'Срок: '+t.title,sub:fmtDate(t.deadline)}); }
  if(t.repeat==='daily'){
    const hm=t.repeatTime||'09:00';
    let day=todayISO();
    let at=new Date(day+'T'+hm).getTime();
    if(at<now||t.repeatDone===day){ day=new Date(new Date(day+'T00:00:00').getTime()+86400000).toISOString().slice(0,10); at=new Date(day+'T'+hm).getTime(); }
    list.push({at,when:at,label:'Ежедневно: '+t.title,sub:'в '+hm});
  }
  return list.filter(r=>r.at>now).sort((a,b)=>a.at-b.at)[0]||null;
}
function checkReminders(){
  const now=Date.now();
  const today=todayISO();
  allRefs().forEach(({c,t})=>{
    if(isDone(t)||(!t.reminder&&!t.repeat))return;
    const jobs=[];
    if(t.dueDateTime){ const dt=new Date(t.dueDateTime).getTime(); if(isFinite(dt)&&t.reminder)jobs.push({key:'due:'+t.id,at:dt-t.reminder*60000,when:dt,label:'Событие · '+ctxShort(c),text:t.title+(t.responsible?', '+t.responsible:'')}); }
    if(t.deadline){ const dl=new Date(t.deadline+'T23:59:59').getTime(); if(isFinite(dl)&&t.reminder)jobs.push({key:'dl:'+t.id,at:dl-t.reminder*60000,when:dl,label:'Срок · '+ctxShort(c),text:t.title}); }
    if(t.repeat==='daily'&&t.repeatDone!==today){
      const hm=t.repeatTime||'09:00';
      const at=new Date(today+'T'+hm).getTime();
      jobs.push({key:'rep:'+t.id+':'+today,at,when:at,label:'Ежедневно · '+ctxShort(c),text:t.title+' — напоминание в '+hm});
    }
    jobs.forEach(j=>{
      const nv=t.notified&&t.notified[j.key];
      if(nv==='d')return;
      const snoozed=typeof nv==='number';
      if(snoozed&&nv>now)return;
      if(now<j.at||(!snoozed&&now>j.when+5*60000))return;
      if(!t.notified)t.notified={};
      t.notified[j.key]='d';
      fireReminder(j,c.key,t.id);
      save();
    });
  });
}

function checkPersonal(){
  const now=Date.now(), today=todayISO();
  const h=new Date().getHours();
  const inDay=h>=8&&h<22;
  const wd=new Date().getDay();
  const workdaysOk=!state.settings.workdays||(wd>=1&&wd<=5);
  const w=state.water;
  const wLog=w.log[today]||0;
  if(w.remind&&w.every>0&&inDay&&workdaysOk&&wLog<w.goal){
    const last=(state.notif.water&&state.notif.water.d===today)?state.notif.water.at:0;
    if(!last){ state.notif.water={d:today,at:now}; save(); }
    else if(now-last>=w.every*60000){
      state.notif.water.at=now; save();
      const left=Math.max(0,w.goal-wLog);
      firePersonal({key:'water:'+today+':'+now,personal:'water',label:'Вода',text:'Пора попить воды. До цели осталось '+left+' мл'});
    }
  }
  state.meds.forEach(m=>{
    if(!m.active)return;
    m.times.forEach(hm=>{
      const at=new Date(today+'T'+hm).getTime();
      if(!isFinite(at)||now<at)return;
      const key='med:'+m.id+':'+hm+':'+today;
      const nv=state.notif[key];
      if(nv==='d')return;
      if(typeof nv==='number'&&nv>now)return;
      state.notif[key]='d'; save();
      firePersonal({key,personal:'med',label:'Препарат: '+m.name,text:'Время принять «'+m.name+'»'+(m.dose?' — '+m.dose:'')});
    });
  });
  const mv=state.move;
  if(mv.enabled&&mv.every>0&&inDay&&workdaysOk){
    const last=(state.notif.move&&state.notif.move.d===today)?state.notif.move.at:0;
    if(!last){ state.notif.move={d:today,at:now}; save(); }
    else if(now-last>=mv.every*60000){
      state.notif.move.at=now; save();
      const ex=moveExercise();
      state._lastMoveEx=ex;
      firePersonal({key:'move:'+today+':'+now,personal:'move',label:'Разминка',text:ex.text});
    }
  }
  const dg=state.digest;
  if(dg.enabled&&(dg.last||'')!==today){
    const nv=state.notif['digest'];
    if(nv!=='d'&&(typeof nv!=='number'||nv<=now)){
      const tp=(dg.time||'08:00').split(':');
      const tMin=parseInt(tp[0],10)*60+(parseInt(tp[1],10)||0);
      const nowMin=h*60+new Date().getMinutes();
      if(nowMin>=tMin){
        state.digest.last=today; save();
        firePersonal({key:'digest:'+today,personal:'digest',label:'Утренний брифинг',text:'План дня, погода и новости — всё готово'});
      }
    }
  }
}

function toggleRowMenu(e,key){
  e.stopPropagation();
  const m=$('#rowMenu');
  let items='';
  if(key.startsWith('p:')){
    const pid=key.slice(2); let oid=null;
    state.orgs.forEach(o=>{ if(o.projects.some(p=>p.id===pid))oid=o.id; });
    if(oid)items=`<button onclick="hideRowMenu();openDocsFor('${key}')">${ICON.book} Документация проекта</button>
      <button onclick="hideRowMenu();openProjectModal('${oid}','${pid}')">${ICON.settings} Настроить проект</button>
      <button class="danger" onclick="hideRowMenu();deleteProject('${oid}','${pid}')">${ICON.trash} Удалить проект</button>`;
  }else if(key.startsWith('o:')){
    const oid=key.slice(2); const o=state.orgs.find(x=>x.id===oid);
    if(o&&!o.general)items=`<button onclick="hideRowMenu();openDocsFor('${key}')">${ICON.book} Документация компании</button>
      <button onclick="hideRowMenu();openProjectModal('${oid}',null)">${ICON.plus} Добавить проект</button>
      <button onclick="hideRowMenu();openOrgModal('${oid}')">${ICON.settings} Настроить компанию</button>
      <button class="danger" onclick="hideRowMenu();deleteOrg('${oid}')">${ICON.trash} Удалить компанию</button>`;
  }
  if(!items){ hideRowMenu(); return; }
  if(m.classList.contains('open')){ hideRowMenu(); return; }
  m.innerHTML=items;
  m.classList.add('open');
  const r=e.currentTarget.getBoundingClientRect();
  const w=m.offsetWidth||200;
  m.style.top=Math.round(r.bottom+4)+'px';
  m.style.left=Math.max(8,Math.round(r.right-w))+'px';
}

function archiveTask(ctxKey,tid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const {c,t}=ref;
  const grp=[t,...subsOf(c,t)];
  const arr=ctxTasks(c);
  grp.forEach(g=>{ const i=arr.indexOf(g); if(i>=0)arr.splice(i,1); });
  grp.forEach(g=>state.archive.push({ctxKey,ctxLabel:ctxLabel(c),task:g}));
  save(); closeModal(); render();
  toast('Задача в архиве — полное удаление только из архива');
}
function restoreArchive(i){
  const a=state.archive[i]; if(!a)return;
  const c=ctxFromKey(a.ctxKey);
  if(c){ ctxTasks(c).push(a.task); a.task.columnId=doneColId(); a.task.completedDate=a.task.completedDate||todayISO(); }
  state.archive.splice(i,1);
  save(); closeModal(); openArchiveModal(); render();
}

/* ============================================================ board */
function tasksForCol(colId){
  const q=search.trim().toLowerCase();
  const cList=viewContexts();
  const out=[];
  cList.forEach(c=>{
    ctxTasks(c).forEach(t=>{
      if(t.parentId)return;
      if(t.columnId===colId&&matchesSearch(t,q)&&respOk(t)&&tagOk(t)&&prioOk(t))out.push({c,t});
    });
  });
  const dl=(a,b)=>{const da=a.t.deadline,db=b.t.deadline;if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da<db?-1:1;};
  if(sortBy==='deadline')out.sort((a,b)=>dl(a,b));
  else if(sortBy==='start')out.sort((a,b)=>{const da=a.t.startDate,db=b.t.startDate;if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da<db?-1:1;});
  else if(sortBy==='priority')out.sort((a,b)=>prioW[b.t.priority||'med']-prioW[a.t.priority||'med']||dl(a,b));
  return out;
}

function viewContexts(){
  if(view.type==='all')return contexts();
  const c=ctxFromKey(view.key);
  if(!c)return [];
  if(c.proj)return [c];
  return [c,...c.org.projects.map(p=>({org:c.org,proj:p,key:'p:'+p.id}))];
}
