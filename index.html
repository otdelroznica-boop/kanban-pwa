          <div class="field"><label>Стакан, мл</label><input type="number" min="50" step="50" value="${w.glass}" onchange="waterSetGlass(this.value)"></div>
          <div class="field"><label>Вес, кг</label><input type="number" min="20" max="250" step="1" value="${w.weight}" onchange="waterSetWeight(this.value)"></div>
          <div class="field"><label>Возраст</label><input type="number" min="10" max="110" step="1" value="${w.age}" onchange="waterSetAge(this.value)"></div>
          <div class="field" style="width:130px"><label>Напоминание</label>
            <select onchange="waterSetEvery(this.value)"><option value="0" ${w.every===0?'selected':''}>Выкл</option>${[30,60,90,120,180].map(v=>`<option value="${v}" ${w.every===v?'selected':''}>Каждые ${v} мин</option>`).join('')}</select>
          </div>
          <div class="field" style="width:auto"><label>Авто по весу</label>
            <label class="chk"><input type="checkbox" ${w.auto?'checked':''} onchange="waterAutoGoal(this.checked)"> ${w.auto?'Рассчитано: '+w.goal+' мл':'рассчитывать цель'}</label>
          </div>
        </div>
        <div style="margin-top:12px">
          <div style="font-size:12px;font-weight:700;color:var(--muted)">Последние 7 дней</div>
          <div class="pomo-week">${wweek.map(x=>`<div class="pw-bar" style="height:${Math.max(4,Math.round(x.ml/wMax*48))}px;background:linear-gradient(180deg,#38bdf8,#0ea5e9)" title="${x.label}: ${x.ml} мл"><b>${x.ml?Math.round(x.ml/100)/10+' л':''}</b><span>${x.label}</span></div>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>`;
  const mv=state.move;
  const mvToday=mv.log[today]||0;
  const mvDone=mv.done[today]||[];
  const lastEx=state._lastMoveEx||null;
  const exList=moveExList();
  const lastIdx=exList.indexOf(lastEx);
  const mvtLeft=moveTimerLeft();
  const medsHtml=`<div class="p-card">
    <div class="p-card-head">${ICON.med} Препараты <span class="mini-actions"><span class="mini" title="Добавить препарат" onclick="openMedModal(null)">${ICON.plus}</span></span></div>
    ${state.meds.length?state.meds.map(medHTML).join(''):'<div class="med-empty">Препаратов пока нет. Добавьте первый — кнопкой «+».</div>'}
  </div>`;
  const moveHtml=`<div class="p-card">
    <div class="p-card-head">${ICON.move} Разминка и движение <span class="mini-actions"><span class="mini" title="Добавить своё упражнение" onclick="openMoveCustomModal()">${ICON.plus}</span></span></div>
    <div class="move-row">
      <label class="chk"><input type="checkbox" ${mv.enabled?'checked':''} onchange="moveToggle(this.checked)"> Напоминать вставать и разминаться</label>
      <label class="chk"><input type="checkbox" ${state.settings.workdays?'checked':''} onchange="state.settings.workdays=this.checked;save();renderPersonal()"> Только в будни</label>
      <div class="field" style="width:120px"><label>Каждые, мин</label>
        <select onchange="moveSetEvery(this.value)">${[30,45,60,90,120].map(v=>`<option value="${v}" ${mv.every===v?'selected':''}>${v} мин</option>`).join('')}</select>
      </div>
      <span class="pomo-stat">Сегодня разминок: <b>${mvToday}</b></span>
    </div>
    ${lastEx&&lastIdx>=0?`<div class="pomo-focus-task move-tip">${ICON.move} Сейчас советует Сенсей: <b style="flex:1;min-width:0">${esc(lastEx.text)}</b>${lastEx.sec?`<button class="b-btn ghost ${mvTimer.i===lastIdx?'timer':''}" onclick="moveTimerToggle(${lastIdx},${lastEx.sec})">${mvTimer.i===lastIdx?'⏱ '+fmtClock(mvtLeft):'⏱ Таймер'}</button>`:''}<button class="b-btn ghost" onclick="moveDone()">Сделал</button></div>`:''}
    <div class="move-exs">${exList.map((ex,i)=>{
      const dn=mvDone.includes(i);
      const tmr=ex.sec?`<button class="btn ghost ${mvTimer.i===i?'timer':''}" data-mvt="${i}" onclick="moveTimerToggle(${i},${ex.sec})">${mvTimer.i===i?'⏱ '+fmtClock(mvtLeft):'⏱ '+fmtClock(ex.sec)}</button>`:'';
      const del=i>=MOVE_EX.length?`<button class="btn ghost" title="Удалить своё упражнение" onclick="delMoveCustom('${ex.id}')">${ICON.trash}</button>`:'';
      return `<div class="move-ex${dn?' done':''}"><span>${esc(ex.text)}</span>${tmr}${ex.ex==='breath'?`<button class="btn ghost" onclick="openBreathModal()">${ICON.wind} Дыхание</button>`:''}<button class="btn ghost ${dn?'done':''}" onclick="moveToggleIdx(${i})">${dn?'Сделано ✓':'Сделал'}</button>${del}</div>`;
    }).join('')}</div>
    <div class="move-row" style="margin-top:8px">
      <span class="pomo-stat">Цикл: <b>${mvDone.length} из ${exList.length}</b></span>
      <button class="btn ghost" onclick="moveNextCycle()">⟳ Следующий цикл</button>
      <button class="btn ghost" onclick="moveReset()">Сброс</button>
    </div>
  </div>`;
  const s=state.sensei;
  const senseiHtml=`<div class="p-card">
    <div class="p-card-head">${ICON.sensei} Сенсей</div>
    <div class="sensei-set">
      <div class="sensei-bigface">${senseiFace(senseiState(),56)}</div>
      <div style="flex:1;min-width:230px">
        <label class="chk"><input type="checkbox" ${s.enabled?'checked':''} onchange="senseiSet('enabled',this.checked)"> Сенсей включён</label>
        <div class="sensei-states">
          ${['kind','strict','calm'].map(st=>`<label class="chk"><input type="checkbox" ${s[st]?'checked':''} onchange="senseiSet('${st}',this.checked)"> ${st==='kind'?'Добрый':st==='strict'?'Строгий':'Спокойный'}</label>`).join('')}
        </div>
        <div class="sensei-opts">
          <label class="chk"><input type="checkbox" ${s.quotes?'checked':''} onchange="senseiSet('quotes',this.checked)"> Цитаты и советы</label>
          <label class="chk"><input type="checkbox" ${s.voice?'checked':''} onchange="senseiSet('voice',this.checked)"> Озвучивать речью</label>
        </div>
        <div class="sensei-opts">
          <div class="field" style="width:150px"><label>Говорить примерно</label>
            <select onchange="senseiSet('freq',this.value)">${[[60,'Каждый час'],[120,'Раз в 2 часа'],[180,'Раз в 3 часа'],[300,'Раз в 5 часов'],[480,'Редко (8 ч)']].map(([v,l])=>`<option value="${v}" ${s.freq===v?'selected':''}>${l}</option>`).join('')}</select>
          </div>
          <button class="btn ghost" onclick="senseiShoot()">Сказать что-нибудь</button>
        </div>
        <div class="field-hint" style="margin-top:8px">Состояние выбирается по ситуации: просроченное — строгий, выполненное — добрый, тишина — спокойный.</div>
      </div>
    </div>
  </div>`;
  const habitsHtml=`<div class="p-card">
    <div class="p-card-head">${ICON.check} Привычки <span class="mini-actions"><span class="mini" title="Добавить привычку" onclick="openHabitModal(null)">${ICON.plus}</span></span></div>
    ${state.habits.length?state.habits.map(habitHTML).join(''):'<div class="med-empty">Привычек пока нет. Добавьте первую — например «Читать 10 минут». Вода, препараты и разминка могут отмечаться сами.</div>'}
  </div>`;
  const dg=state.digest;
  const digestHtml=`<div class="p-card">
    <div class="p-card-head">${ICON.sun} Утренний брифинг</div>
    <label class="chk"><input type="checkbox" ${dg.enabled?'checked':''} onchange="digestSet('enabled',this.checked)"> Показывать брифинг утром</label>
    <div class="digest-row">
      <div class="field"><label>Город</label><input value="${esc(dg.city||'Москва')}" maxlength="60" onchange="digestSetCity(this.value)"></div>
      <div class="field"><label>Время</label><input type="time" value="${dg.time||'08:00'}" onchange="digestSet('time',this.value)"></div>
    </div>
    <div class="field"><label>Темы новостей</label><div class="digest-genres">${DIGEST_GENRES.map(([g,l])=>`<span class="dg-chip ${(dg.genres||[]).includes(g)?'on':''}" onclick="digestGenre('${g}')">${l}</span>`).join('')}</div></div>
    <div class="digest-row">
      <button class="btn primary" onclick="openDigestModal()">Открыть брифинг</button>
      <span id="digStatus" class="digest-status"></span>
    </div>
  </div>`;
  el.innerHTML=pomoHtml+waterHtml+medsHtml+moveHtml+senseiHtml+habitsHtml+digestHtml;
  if(state.digest.enabled&&!(digestCache&&(Date.now()-digestCacheAt)<10*60000))fetchDigest(false);
}

/* ============================================================ render */
function dailyRollover(){
  const today=todayISO();
  const firstCol=state.columns.length?state.columns[0].id:null;
  contexts().forEach(c=>ctxTasks(c).forEach(t=>{
    if(!t.repeat)return;
    if(isDone(t)&&!t.repeatDone)t.repeatDone=today;
    if(t.repeatDone&&t.repeatDone!==today){
      if(firstCol){ t.columnId=firstCol; t.completedDate=null; }
      t.repeatDone=null; t.notified={};
    }
  }));
}
function renderGantt(){
  const el=$('#ganttWrap'); if(!el)return;
  const gf={orgId:$('#gtOrg')?$('#gtOrg').value:(state._ganttOrg||''),sprint:$('#gtSprint')?$('#gtSprint').value:(state._ganttSprint||'')};
  const orgOpts='<option value="">Все организации</option>'+state.orgs.map(o=>`<option value="${o.id}" ${gf.orgId===o.id?'selected':''}>${o.general?'Общее':esc(o.name)}</option>`).join('');
  const spOpts='<option value="">Все спринты</option>'+state.sprints.map(s=>`<option value="${esc(s)}" ${gf.sprint===s?'selected':''}>${esc(s)}</option>`).join('');
  const filters=`<div class="gantt-filters"><span class="f-lbl">Организация:</span><select id="gtOrg" onchange="state._ganttOrg=this.value;save();renderGantt()">${orgOpts}</select><span class="f-lbl">Спринт:</span><select id="gtSprint" onchange="state._ganttSprint=this.value;save();renderGantt()">${spOpts}</select></div>`;
  const items=[];
  viewContexts().forEach(c=>{
    if(gf.orgId&&c.org.id!==gf.orgId)return;
    ctxTasks(c).forEach(t=>{
      if(t.parentId)return;
      if(gf.sprint&&(t.sprint||'')!==gf.sprint)return;
      const s=t.startDate||t.deadline, e=t.deadline||t.startDate;
      if(!s||!e)return;
      items.push({c,t,s,e});
    });
  });
  if(!items.length){
    el.innerHTML=`<div class="gantt-box">${filters}<div class="gantt-empty">Нет задач с датами. Укажите «Начало» и «Срок» у карточек — они появятся на диаграмме.</div></div>`;
    return;
  }
  items.sort((a,b)=>a.s<b.s?-1:1);
  const day=86400000;
  const start=new Date(items.reduce((m,x)=>x.s<m?x.s:m,items[0].s));
  start.setDate(start.getDate()-1);
  const end=new Date(items.reduce((m,x)=>x.e>m?x.e:m,items[0].e));
  end.setDate(end.getDate()+7);
  const total=Math.round((end-start)/day)+1;
  const today=new Date(); today.setHours(0,0,0,0);
  const todayStart=new Date(today); todayStart.setDate(todayStart.getDate()-1);
  const offToday=Math.round((todayStart-start)/day);
  const weekW=28,nameW=180,headH=26,rowH=26;
  const idxOf=dt=>Math.round((new Date(dt)-start)/day);
  const W=nameW+total*weekW;
  const fmt=d=>{const dd=new Date(d);return dd.getDate()+'.'+String(dd.getMonth()+1).padStart(2,'0');};
  let headCells='';
  for(let i=0;i<total;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const dow=d.getDay();
    headCells+=`<div class="gantt-cell${dow===0||dow===6?' wk':''}" style="width:${weekW}px">${dow===1?fmt(d):''}</div>`;
  }
  const head=`<div class="gantt-row gantt-head" style="height:${headH}px"><div class="gantt-name-col" style="width:${nameW}px">Задача</div><div class="gantt-cells" style="width:${total*weekW}px">${headCells}</div></div>`;
  const rows=items.map(x=>{
    const i0=idxOf(x.s),i1=idxOf(x.e);
    const done=isDone(x.t);
    const lateCls=(!done&&x.t.deadline&&x.t.deadline<todayISO())?' late':'';
    const left=i0*weekW+3, w=Math.max(weekW-4,(i1-i0+1)*weekW-6);
    const bar=`<div class="gantt-bar${done?' done':''}${lateCls}" style="left:${left}px;width:${w}px;background:${done?'linear-gradient(180deg,#34d399,#10b981)':colColor(x.t.columnId)}" title="${x.t.title} · ${colName(x.t.columnId)}" onclick="openCardModal('${x.t.id}','${x.c.key}')">${done?'✓':''}</div>`;
    return `<div class="gantt-row" style="height:${rowH}px"><div class="gantt-name-col" style="width:${nameW}px"><span class="gantt-t">${x.t.title}</span><span class="gantt-sub">${colName(x.t.columnId)}</span></div><div class="gantt-line" style="width:${total*weekW}px">${bar}</div></div>`;
  }).join('');
  const tLine=offToday>=0&&offToday<=total?`<div class="gantt-today" style="left:${nameW+offToday*weekW}px"></div>`:'';
  el.innerHTML=`<div class="gantt-box">${filters}<div class="gantt-scroll"><div class="gantt-canvas" style="width:${W}px;position:relative">${head}${rows}${tLine}</div></div><div class="gantt-hint">Полосы — от «Начала» до «Срока». Красная линия — сегодня. Зелёные — выполненные. Клик по полосе открывает карточку.</div></div>`;
}
function render(){
  hideRowMenu();
  dailyRollover();
  renderProjects();
  renderTabs();
  renderStats();
  if(currentTab==='board'){ renderToolbar(); renderBoard(); }
  else if(currentTab==='today')renderToday();
  else if(currentTab==='calendar')renderCalendar();
  else if(currentTab==='docs')renderDocs();
  else if(currentTab==='notes')renderNotes();
  else if(currentTab==='personal')renderPersonal();
  else if(currentTab==='brain')renderBrain();
  else if(currentTab==='report')initReport();
  else if(currentTab==='gantt')renderGantt();
  updateSenseiFab();
  refreshTimerLabels();
}

document.addEventListener('DOMContentLoaded',()=>{
  $('#btnNewOrg').onclick=()=>openOrgModal(null);
  $('#btnNewOrg2').onclick=()=>openOrgModal(null);
  $('#btnColumns').onclick=openColumnsModal;
  $('#btnExport').onclick=exportData;
  $('#btnImport').onclick=()=>$('#importFile').click();
  $('#btnSound').onclick=toggleSound;
  $('#btnBell').onclick=enableNotifs;
  $('#btnSettings').onclick=openSettingsModal;
  $('#btnHelp').onclick=openHelpModal;
  $('#btnLogin').onclick=signIn;
  document.querySelectorAll('#tabs button').forEach(b=>{ b.onclick=()=>setTab(b.dataset.t); });
  $('#repBuild').onclick=buildReport;
  $('#repExcel').onclick=reportExcel;
  $('#repPdf').onclick=reportPdf;
  document.querySelectorAll('.preset-btn').forEach(b=>{ b.onclick=()=>setReportPreset(b.dataset.r); });
  $('#importFile').addEventListener('change',e=>{ if(e.target.files[0])importData(e.target.files[0]); e.target.value=''; });
  $('#searchInput').addEventListener('input',e=>{ search=e.target.value; render(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
  document.addEventListener('click',e=>{ if(!e.target.closest('.row-menu,.mini.dots'))hideRowMenu(); });
  const sb=document.querySelector('.sidebar'); if(sb)sb.addEventListener('scroll',hideRowMenu);
  $('#btnBurger').onclick=()=>document.body.classList.toggle('sb-open');
  document.addEventListener('click',e=>{
    if(!document.body.classList.contains('sb-open'))return;
    if(e.target.closest('.project-item,.all-item')||(!e.target.closest('.sidebar')&&!e.target.closest('#btnBurger')))
      document.body.classList.remove('sb-open');
  });
  if('Notification' in window&&Notification.permission==='granted'&&!state.settings.notifications)state.settings.notifications=true;
  applyTheme();
  updateHeader();
  render();
  updateSenseiFab();
  senseiReschedule();
  if(state.sensei.enabled){
    setTimeout(()=>{
      const h=new Date().getHours();
      const st=senseiState();
      senseiSay(h<12?'Доброе утро, ученик. Начнём день с малого?':h>=20?'День клонится к вечеру. Проверь дедлайны и выпей воды.':'Привет, ученик. Что сегодня займёт твой фокус?',st);
    },1500);
  }
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  }
  initAuth();
});
</script>
