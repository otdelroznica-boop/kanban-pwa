  currentModal=ref?{pid:ctxKey,tid}:null;
  const responsibleList=[...new Set(allTasks().map(y=>y.responsible).filter(Boolean))];
  const colsOpts=state.columns.map(col=>`<option value="${col.id}" ${t&&t.columnId===col.id?'selected':presetCol===col.id?'selected':''}>${esc(col.name)}</option>`).join('');
  const spent=t?totalSpent(t):0;
  const running=t?!!t.timer:false;
  const prioOpts=Object.entries(PRIO).map(([k,p])=>`<option value="${k}" ${(!t&&k==='med')||(t&&(t.priority||'med')===k)?'selected':''}>${p.label}</option>`).join('');
  const logRows=t&&(t.intervals||[]).length?[...t.intervals].reverse().map((i,ri)=>{
    const dur=i.end?i.end-i.start:Date.now()-i.start;
    const realIdx=t.intervals.length-1-ri;
    return `<div class="log-row"><span>${new Date(i.start).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${i.end?' — '+new Date(i.end).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):' — сейчас'}</span>
      <span class="log-dur">${fmtDur(Math.floor(dur/1000))}</span>
      <button class="log-del" title="Удалить интервал" onclick="deleteInterval('${ctxKey}','${t.id}',${realIdx})">${ICON.trash}</button></div>`;
  }).join(''):'<div class="log-empty">Замеров пока нет.</div>';
  const remOpts=REMINDER_OPTS.map(([v,l])=>`<option value="${v}" ${t&&String(t.reminder||'')===v?'selected':''}>${l}</option>`).join('');
  const dueVal=t&&t.dueDateTime?t.dueDateTime:(presetDate?presetDate+'T09:00':'');
  const tagVal=(t&&t.tags||[]).join(', ');
  const tagList=[...new Set(allTasks().flatMap(y=>y.tags||[]))];
  let whereField='';
  if(!c&&!t){
    const groups=state.orgs.map(o=>{
      const nm=o.general?'Общее':esc(o.name);
      const opts=[`<option value="o:${o.id}" ${o.general?'selected':''}>${o.general?'Общее (без организации)':nm+' — карточки компании'}</option>`];
      o.projects.forEach(p=>opts.push(`<option value="p:${p.id}">${nm} — ${esc(p.name)}</option>`));
      return `<optgroup label="${nm}">${opts.join('')}</optgroup>`;
    }).join('');
    whereField=`<div class="field"><label>Организация / раздел</label><select id="tkCtx">${groups}</select></div>`;
  } else if(c){
    whereField=`<div class="field"><label>Организация / раздел</label><div class="field-ctx-label">${esc(ctxLabel(c))}</div></div>`;
  }
  const clRows=(t&&(t.checklist||[]).length)?t.checklist.map(i=>`<div class="log-row"><span class="td-dot" style="background:${i.done?'var(--ok)':'var(--border)'}"></span><span class="log-note" style="${i.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(i.text)}</span>
    <button class="log-del" title="Выполнено / не выполнено" onclick="toggleCheck('${ctxKey}','${t.id}','${i.id}')">${i.done?ICON.check:''}</button>
    <button class="log-del" title="Удалить пункт" onclick="delCheck('${ctxKey}','${t.id}','${i.id}')">${ICON.trash}</button></div>`).join(''):'<div class="log-empty">Чек-лист пуст — добавьте пункты.</div>';
  const subRows=(t&&!t.parentId)?(subsOf(c,t).map(s=>{
    const sd=isDone(s);
    return `<div class="log-row"><span class="td-dot" style="background:${sd?'var(--ok)':'var(--border)'}"></span><span class="log-note" style="${sd?'text-decoration:line-through;color:var(--muted)':''}">${esc(s.title)}</span>
      <button class="log-del" onclick="openCardModal('${s.id}','${ctxKey}')" title="Открыть">${ICON.settings}</button>
      <button class="log-del" onclick="toggleSubDone('${ctxKey}','${t.id}','${s.id}')" title="Выполнено">${ICON.check}</button>
      <button class="log-del" title="Удалить подзадачу" onclick="deleteTask('${ctxKey}','${s.id}')">${ICON.trash}</button></div>`;
  }).join('')||'<div class="log-empty">Подзадач нет.</div>'):'';
  const attRows=t&&(t.attachments||[]).length?t.attachments.map(a=>`<div class="att-row">
    <a class="att-name" href="${a.dataUrl}" download="${esc(a.name)}">${ICON.attach} ${esc(a.name)}</a>
    <span class="att-size">${(a.size/1024).toFixed(1)} КБ</span>
    <button class="log-del" title="Удалить" onclick="delAttachment('${ctxKey}','${t.id}','${a.id}')">${ICON.trash}</button></div>`).join(''):'<div class="log-empty">Вложений нет.</div>';
  const cmtRows=t&&(t.comments||[]).length?[...t.comments].reverse().map(cm=>`<div class="cmt">
    <div class="cmt-head"><span class="cmt-author">${esc(cm.author)}</span><span>${new Date(cm.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <button class="cmt-del" title="Удалить" onclick="delComment('${ctxKey}','${t.id}','${cm.id}')">${ICON.trash}</button></div>
    <div class="cmt-text">${esc(cm.text)}</div></div>`).join(''):'<div class="log-empty">Комментариев нет.</div>';
  openModal(`
    <div class="modal-head"><h3>${t?(t.parentId?'Подзадача':'Задача'):'Новая задача'}</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      ${whereField}
      <div class="field"><label>Название *</label><input type="text" id="tkTitle" maxlength="160" value="${t?esc(t.title):''}" placeholder="Что нужно сделать?"></div>
      <div class="field"><label>Описание</label><textarea id="tkDesc" placeholder="Детали, ссылки, что в итоге сделать...">${t?esc(t.desc||''):''}</textarea></div>
      <div class="field"><div class="row">
        <div><label>Приоритет</label><select id="tkPrio">${prioOpts}</select></div>
        <div><label>Ответственный</label><input type="text" id="tkResp" list="respList" value="${t?esc(t.responsible||''):''}" placeholder="Кто делает?"><datalist id="respList">${responsibleList.map(r=>`<option value="${esc(r)}">`).join('')}</datalist></div>
        <div><label>Статус</label><select id="tkCol">${colsOpts}</select></div>
      </div></div>
      <div class="field"><label>Метки (через запятую)</label><input type="text" id="tkTags" list="tagList" value="${esc(tagVal)}" placeholder="Например: срочно, клиент, аналитика"><datalist id="tagList">${tagList.map(r=>`<option value="${esc(r)}">`).join('')}</datalist></div>
      <div class="field"><div class="row">
        <div><label>Начало</label><input type="date" id="tkStart" value="${t?esc(t.startDate||''):todayISO()}"></div>
        <div><label>Срок (дедлайн)</label><input type="date" id="tkDeadline" value="${t?esc(t.deadline||''):''}"></div>
        <div><label>Завершено</label><input type="date" id="tkDone" value="${t?esc(t.completedDate||''):''}"></div>
      </div></div>
      <div class="field"><div class="row">
        <div><label>Событие (дата и время)</label><input type="datetime-local" id="tkDue" value="${esc(dueVal)}"></div>
        <div><label>Напоминание</label><select id="tkRem">${remOpts}</select></div>
      </div>
      <div class="field-hint">Событие — для встреч, попадёт в календарь. Напоминание сработает и для события, и для срока.</div></div>
      <div class="field"><div class="row">
        <div><label>Оценка (часы)</label><input type="number" id="tkEst" min="0" step="0.5" value="${t&&t.estimate?t.estimate:''}" placeholder="0"></div>
        <div style="flex:2"><label>Время</label>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums" id="tkSpent">${fmtDur(spent)}</span>
            <button class="btn ${running?'danger':'primary'}" id="tkTimerBtn" style="padding:6px 12px">${running?'Остановить таймер':'Запустить таймер'}</button>
            <span id="tkTimerLive" style="color:var(--warn);font-weight:700;font-variant-numeric:tabular-nums">${running?'Идёт замер…':''}</span>
          </div></div>
      </div></div>
      ${t&&!t.parentId?`<div class="field"><label>Чек-лист</label><div class="log-block">${clRows}</div>
        <div class="add-inline"><input type="text" id="tkCheckInput" placeholder="Новый пункт чек-листа..."><button class="btn ghost" onclick="addCheck('${ctxKey}','${t.id}')">${ICON.plus} Добавить</button></div></div>
      <div class="field"><label>Подзадачи</label><div class="log-block">${subRows}</div>
        <div class="add-inline"><input type="text" id="tkSubInput" placeholder="Название подзадачи..."><button class="btn ghost" onclick="addSubTask('${ctxKey}','${t.id}')">${ICON.plus} Добавить</button></div></div>
      <div class="field"><label>Вложения</label><div class="log-block">${attRows}</div>
        <div class="add-inline"><button class="btn ghost" onclick="$('#tkFile').click()">${ICON.attach} Прикрепить файл</button><input type="file" id="tkFile" multiple style="display:none"></div></div>
      <div class="field"><label>Комментарии</label><div class="log-block">${cmtRows}</div>
        <div class="add-inline"><input type="text" id="tkCmtInput" placeholder="Комментарий..."><button class="btn ghost" onclick="addComment('${ctxKey}','${t.id}')">${ICON.plus} Добавить</button></div></div>`:''}
      <div class="field"><label>Журнал времени</label><div class="log-block">${logRows}</div></div>
    </div>
    <div class="modal-foot">
      ${t?`<button class="btn ghost" onclick="duplicateTask('${ctxKey}','${t.id}')">${ICON.copy} Дублировать</button>`:''}
      ${t&&isDone(t)?`<button class="btn ghost" onclick="archiveTask('${ctxKey}','${t.id}')">${ICON.archive} В архив</button>`:''}
      ${t?`<button class="btn danger" style="margin-right:auto" onclick="deleteTask('${ctxKey}','${t.id}')">${ICON.trash} Удалить</button>`:''}
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="saveTask('${ctxKey||''}','${t?t.id:''}')">${ICON.check} ${t?'Сохранить':'Создать'}</button>
    </div>`,modal=>{
    const btn=modal.querySelector('#tkTimerBtn');
    if(btn&&t)btn.onclick=()=>toggleTimer(ctxKey,t.id,true);
    const inp=modal.querySelector('#tkTitle');
    if(inp){ inp.focus(); if(!t)inp.select(); }
    const f=modal.querySelector('#tkFile');
    if(f&&t)f.onchange=()=>{ addAttachments(ctxKey,t.id,f.files); f.value=''; };
    const ci=modal.querySelector('#tkCheckInput');
    if(ci)ci.addEventListener('keydown',e=>{ if(e.key==='Enter')addCheck(ctxKey,t.id); });
    const si=modal.querySelector('#tkSubInput');
    if(si)si.addEventListener('keydown',e=>{ if(e.key==='Enter')addSubTask(ctxKey,t.id); });
    const cm=modal.querySelector('#tkCmtInput');
    if(cm)cm.addEventListener('keydown',e=>{ if(e.key==='Enter')addComment(ctxKey,t.id); });
  });
}
function collectTaskInputs(){
  const title=$('#tkTitle').value.trim();
  if(!title){ toast('Укажите название задачи','error'); return null; }
  const est=parseFloat($('#tkEst').value);
  const tags=$('#tkTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  return {
    title,
    desc:$('#tkDesc').value.trim(),
    responsible:$('#tkResp').value.trim(),
    columnId:$('#tkCol').value,
    priority:$('#tkPrio').value,
    tags:[...new Set(tags)],
    estimate:isFinite(est)&&est>0?est:null,
    startDate:$('#tkStart').value||todayISO(),
    deadline:$('#tkDeadline').value||null,
    completedDate:$('#tkDone').value||null,
    dueDateTime:$('#tkDue').value||null,
    reminder:$('#tkRem').value?parseInt($('#tkRem').value,10):null,
  };
}
function saveTask(ctxKey,tid){
  const data=collectTaskInputs();
  if(!data)return;
  if(tid){
    const ref=findTaskRef(tid,ctxKey);
    if(!ref){ toast('Задача не найдена','error'); return; }
    Object.assign(ref.t,data);
    syncSubs(ref.c,ref.t);
    toast('Задача сохранена');
  } else {
    let c=ctxKey?ctxFromKey(ctxKey):null;
    if(!c){ const sel=$('#tkCtx'); if(!sel||!sel.value){ toast('Выберите раздел','error'); return; } c=ctxFromKey(sel.value); }
    if(!c){ toast('Раздел не найден','error'); return; }
    ctxTasks(c).push({id:uid(),...data,created:Date.now(),checklist:[],comments:[],attachments:[],intervals:[],timer:null,notified:{}});
    toast('Задача создана');
  }
  save(); closeModal(); render();
}
function deleteTask(ctxKey,tid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const subs=subsOf(ref.c,ref.t);
  if(!confirm(subs.length?`Удалить задачу и ${subs.length} подзадач(и)?`:'Удалить задачу?'))return;
  const arr=ctxTasks(ref.c);
  arr.splice(arr.indexOf(ref.t),1);
  subs.forEach(s=>{ const i=arr.indexOf(s); if(i>=0)arr.splice(i,1); });
  save(); closeModal(); render();
  toast('Задача удалена');
}
function duplicateTask(ctxKey,tid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const cp=JSON.parse(JSON.stringify(ref.t));
  cp.id=uid();
  cp.title=cp.title+' (копия)';
  cp.created=Date.now();
  cp.timer=null;
  cp.notified={};
  const arr=ctxTasks(ref.c);
  arr.splice(arr.indexOf(ref.t)+1,0,cp);
  save(); openCardModal(cp.id,ctxKey); render();
  toast('Создана копия');
}
function deleteInterval(ctxKey,tid,idx){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const iv=ref.t.intervals||[]; if(idx<0||idx>=iv.length)return;
  if(!confirm('Удалить этот замер?'))return;
  iv.splice(idx,1);
  save(); openCardModal(tid,ctxKey); render();
}

/* --- checklist / sub-tasks / attachments / comments --- */
function rerender(){
  if(currentModal)openCardModal(currentModal.tid,currentModal.pid);
  else render();
}
function toggleCheck(ctxKey,tid,cid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const it=(ref.t.checklist||[]).find(i=>i.id===cid); if(!it)return;
  it.done=!it.done;
  save(); rerender();
}
function delCheck(ctxKey,tid,cid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  ref.t.checklist=ref.t.checklist.filter(i=>i.id!==cid);
  save(); openCardModal(tid,ctxKey); render();
}
function addCheck(ctxKey,tid){
  const inp=$('#tkCheckInput'); if(!inp)return;
  const text=inp.value.trim(); if(!text)return;
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  ref.t.checklist.push({id:uid(),text,done:false});
  inp.value='';
  save(); openCardModal(tid,ctxKey); render();
}
function toggleSubDone(ctxKey,pid,sid){
  const ref=findTaskRef(pid,ctxKey); if(!ref)return;
  const sub=findTaskRef(sid,ctxKey); if(!sub)return;
  sub.t.columnId=isDone(sub.t)?ref.t.columnId:doneColId();
  if(isDone(sub.t)&&!sub.t.completedDate)sub.t.completedDate=todayISO();
  save(); rerender();
}
function addSubTask(ctxKey,pid){
  const inp=$('#tkSubInput'); if(!inp)return;
  const text=inp.value.trim(); if(!text)return;
  const ref=findTaskRef(pid,ctxKey); if(!ref)return;
  ctxTasks(ref.c).push({id:uid(),title:text,parentId:pid,columnId:ref.t.columnId,priority:ref.t.priority||'med',created:Date.now(),checklist:[],comments:[],attachments:[],intervals:[],timer:null,notified:{}});
  inp.value='';
  save(); openCardModal(pid,ctxKey); render();
  toast('Подзадача создана');
}
function addAttachments(ctxKey,tid,files){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  if(!ref.t.attachments)ref.t.attachments=[];
  [...files].forEach(f=>{
    if(f.size>800000){ toast('Файл слишком большой (>800 КБ): '+f.name,'error'); return; }
    const r=new FileReader();
    r.onload=()=>{
      ref.t.attachments.push({id:uid(),name:f.name,size:f.size,dataUrl:r.result});
      save();
      try{ openCardModal(tid,ctxKey); }catch(e){}
    };
    r.readAsDataURL(f);
  });
  render();
}
function delAttachment(ctxKey,tid,aid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  ref.t.attachments=ref.t.attachments.filter(a=>a.id!==aid);
  save(); openCardModal(tid,ctxKey); render();
}
function addComment(ctxKey,tid){
  const inp=$('#tkCmtInput'); if(!inp)return;
  const text=inp.value.trim(); if(!text)return;
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  ref.t.comments.push({id:uid(),author:'Я',text,at:Date.now()});
  inp.value='';
  save(); openCardModal(tid,ctxKey); render();
}
function delComment(ctxKey,tid,cid){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  ref.t.comments=ref.t.comments.filter(cm=>cm.id!==cid);
  save(); openCardModal(tid,ctxKey); render();
}

/* ============================================================ timer */
function toggleTimer(ctxKey,tid,keepModal){
  const ref=findTaskRef(tid,ctxKey); if(!ref)return;
  const {c,t}=ref;
  if(t.timer){ t.intervals.push({start:t.timer.start,end:Date.now()}); t.timer=null; toast('Таймер остановлен'); }
  else { t.timer={start:Date.now()}; toast('Таймер запущен'); }
  save();
  if(keepModal)openCardModal(tid,ctxKey); else render();
}
setInterval(refreshTimerLabels,1000);
function refreshTimerLabels(){
  let runningCount=0;
  allRefs().forEach(({t})=>{ if(t.timer)runningCount++; });
  document.querySelectorAll('#board .tt').forEach(el=>{
    const tid=el.id.replace('tt-','');
    const card=el.closest('[data-tid]');
    if(!card)return;
    const ref=findTaskRef(tid,card.dataset.ctx);
    if(ref&&ref.t.timer)el.textContent='Идёт замер: '+fmtDur(totalSpent(ref.t));
  });
  const live=$('#tkTimerLive');
  if(live&&currentModal){
    const f=findTaskRef(currentModal.tid,currentModal.pid);
    const isRunning=f&&f.t.timer;
    live.textContent=isRunning?'Идёт замер…':'';
    const sp=$('#tkSpent');
    if(sp&&f)sp.textContent=fmtDur(totalSpent(f.t));
  }
  renderStats(runningCount);
}

/* ============================================================ columns */
function openColumnsModal(){
  openModal(`
    <div class="modal-head"><h3>Колонки доски (статусы)</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="col-rows" id="colRows">
        ${state.columns.map((c,i)=>`
        <div class="col-row" data-i="${i}">
          <span class="mini" ${i===0?'style="visibility:hidden"':''} onclick="moveColumn(${i},-1)" title="Выше">${ICON.up}</span>
          <span class="mini" ${i===state.columns.length-1?'style="visibility:hidden"':''} onclick="moveColumn(${i},1)" title="Ниже">${ICON.down}</span>
          <span style="width:10px;height:10px;border-radius:3px;background:${COLUMN_COLORS[i%COLUMN_COLORS.length]}"></span>
          <input type="text" value="${esc(c.name)}" data-id="${c.id}" maxlength="40">
          <span class="mini" onclick="removeColumn('${c.id}')" title="Удалить колонку">${ICON.trash}</span>
        </div>`).join('')}
      </div>
      <button class="btn ghost" style="width:100%;justify-content:center;margin-top:4px" onclick="addColumn()">${ICON.plus} Добавить колонку</button>
      <p style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5">Каждая колонка — свой цвет, карточки окрашиваются по статусу. Последняя колонка = «готово».</p>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Закрыть</button><button class="btn primary" onclick="saveColumns()">${ICON.check} Применить</button></div>`);
}
function addColumn(){
  const rows=$('#colRows');
  const i=state.columns.length;
  state.columns.push({id:uid(),name:'Новая колонка'});
  rows.insertAdjacentHTML('beforeend',`<div class="col-row" data-i="${i}">
    <span class="mini" onclick="moveColumn(${i},-1)" title="Выше">${ICON.up}</span>
    <span class="mini" style="visibility:hidden" title="Ниже">${ICON.down}</span>
    <span style="width:10px;height:10px;border-radius:3px;background:${COLUMN_COLORS[i%COLUMN_COLORS.length]}"></span>
    <input type="text" value="Новая колонка" data-id="${state.columns[i].id}" maxlength="40">
    <span class="mini" onclick="removeColumn('${state.columns[i].id}')" title="Удалить колонку">${ICON.trash}</span></div>`);
  const prev=rows.querySelectorAll('.col-row');
  if(prev.length>1)prev[prev.length-2].querySelector('.mini[title="Ниже"]').style.visibility='visible';
}
function moveColumn(i,dir){
  const j=i+dir;
  if(j<0||j>=state.columns.length)return;
  [state.columns[i],state.columns[j]]=[state.columns[j],state.columns[i]];
  save(); openColumnsModal();
}
function removeColumn(id){
  if(state.columns.length<=1){ toast('Должна остаться хотя бы одна колонка','error'); return; }
  const i=state.columns.findIndex(c=>c.id===id);
  const col=state.columns[i];
  if(!confirm(`Удалить колонку «${col.name}»? Задачи из неё переместятся в первую колонку.`))return;
  state.columns.splice(i,1);
  const first=state.columns[0].id;
  allTasks().forEach(t=>{ if(t.columnId===id)t.columnId=first; });
  save(); openColumnsModal(); render();
}
function saveColumns(){
  const rows=$('#colRows').querySelectorAll('.col-row');
  rows.forEach(r=>{ const inp=r.querySelector('input'); const col=state.columns.find(c=>c.id===inp.dataset.id); if(col)col.name=inp.value.trim()||col.name; });
  save(); closeModal(); render();
  toast('Колонки сохранены');
}

/* ============================================================ TODAY */
function todayRowHtml(ref,timeHtml,sub){
  const {c,t}=ref;
  const ov=isOverdue(t);
  return `<div class="tday ${ov?'overdue':''}" onclick="openCardModal('${t.id}','${c.key}')">
    <span class="td-dot" style="background:${ctxColor(c)}"></span>
    <span class="td-time ${ov?'danger':''}">${timeHtml}</span>
    <div class="td-main"><div class="td-title">${esc(t.title)}</div>
    <div class="td-sub">${esc(ctxShort(c))}${t.responsible?', '+esc(t.responsible):''}${sub?' · '+esc(sub):''}</div></div>
  </div>`;
}
function renderToday(){
  const el=$('#tabToday');
  const now=Date.now();
  const running=allRefs().filter(r=>r.t.timer);
  const overdue=allRefs().filter(r=>isOverdue(r.t)).sort((a,b)=>(a.t.deadline<b.t.deadline?-1:1));
  const dueToday=allRefs().filter(r=>r.t.deadline===todayISO()&&!isDone(r.t));
  const eventsToday=allRefs().filter(r=>r.t.dueDateTime&&dayKeyOf(r.t.dueDateTime)===todayISO()).sort((a,b)=>a.t.dueDateTime<b.t.dueDateTime?-1:1);
  const eventsSoon=allRefs().filter(r=>r.t.dueDateTime&&dayKeyOf(r.t.dueDateTime)>todayISO()&&!isDone(r.t)).sort((a,b)=>a.t.dueDateTime<b.t.dueDateTime?-1:1).slice(0,8);
  const rems=allRefs().map(r=>({r,nr:nextRemindersOf(r.t)})).filter(x=>x.nr).sort((a,b)=>a.nr.at-b.nr.at).slice(0,8);
  const backlog=allRefs().filter(r=>!isDone(r.t)&&!r.t.deadline&&!r.t.timer).sort((a,b)=>(b.t.created||0)-(a.t.created||0)).slice(0,12);
  let html='<div class="today-grid">';
  html+='<div class="today-col">';
  html+=`<div class="today-head">Что сейчас${running.length?` <span class="badge b-warn">${running.length}</span>`:''}</div>`;
  html+=running.length?`<div class="today-list">${running.map(r=>todayRowHtml(r,fmtDur(totalSpent(r.t))+' · идёт','')).join('')}</div>`:`<div class="today-list"><div class="today-empty">Ничего не запущено.</div></div>`;
  html+=`<div class="today-head">События сегодня${eventsToday.length?` <span class="badge b-warn">${eventsToday.length}</span>`:''}</div>`;
  html+=eventsToday.length?`<div class="today-list">${eventsToday.map(r=>todayRowHtml(r,fmtT(r.t.dueDateTime),'')).join('')}</div>`:`<div class="today-list"><div class="today-empty">Нет событий на сегодня.</div></div>`;
  html+=`<div class="today-head">Сроки сегодня${dueToday.length?` <span class="badge b-warn">${dueToday.length}</span>`:''}</div>`;
  html+=dueToday.length?`<div class="today-list">${dueToday.map(r=>todayRowHtml(r,'сегодня','')).join('')}</div>`:`<div class="today-list"><div class="today-empty">Нет дедлайнов на сегодня.</div></div>`;
  html+='</div><div class="today-col">';
  html+=`<div class="today-head">Просрочено${overdue.length?` <span class="badge b-danger">${overdue.length}</span>`:''}</div>`;
  html+=overdue.length?`<div class="today-list">${overdue.map(r=>todayRowHtml(r,fmtDate(r.t.deadline),'')).join('')}</div>`:`<div class="today-list"><div class="today-empty">Просроченных нет.</div></div>`;
  html+='<div class="today-head">Ближайшие события</div>';
  html+=eventsSoon.length?`<div class="today-list">${eventsSoon.map(r=>todayRowHtml(r,fmtDT(r.t.dueDateTime).slice(0,5),fmtDT(r.t.dueDateTime))).join('')}</div>`:`<div class="today-list"><div class="today-empty">Нет ближайших событий.</div></div>`;
  html+=`<div class="today-head">Ближайшие напоминания${rems.length?` <span class="badge">${rems.length}</span>`:''}</div>`;
  html+=rems.length?`<div class="today-list">${rems.map(x=>{
    const mins=Math.max(0,Math.round((x.nr.at-now)/60000));
    return todayRowHtml(x.r,mins===0?'сейчас':mins<60?mins+'м':mins<1440?Math.round(mins/60)+'ч':Math.round(mins/1440)+'дн','напомнит');
  }).join('')}</div>`:`<div class="today-list"><div class="today-empty">Активных напоминаний нет.</div></div>`;
  html+=`<div class="today-head">Не забыть (без срока)${backlog.length?` <span class="badge">${backlog.length}</span>`:''}</div>`;
  html+=backlog.length?`<div class="today-list">${backlog.map(r=>todayRowHtml(r,'—','')).join('')}</div>`:`<div class="today-list"><div class="today-empty">Нет задач без срока.</div></div>`;
  html+='</div></div>';
  el.innerHTML=html;
}

/* ============================================================ CALENDAR */
function calItemsFor(key){
  const items=[];
  allRefs().forEach(({c,t})=>{
    if(t.dueDateTime&&dayKeyOf(t.dueDateTime)===key)items.push({c,t,type:'ev',sort:t.dueDateTime});
    if(t.deadline===key)items.push({c,t,type:'dl',sort:(t.dueDateTime?t.dueDateTime:key+'T23:59:59')});
  });
  items.sort((a,b)=>a.sort<b.sort?-1:1);
  return items;
}
function calItemHTML(it){
  const done=isDone(it.t);
  const colr=ctxColor(it.c);
  const time=it.type==='ev'?fmtT(it.t.dueDateTime):'срок';
  return `<div class="cal-item ${it.type} ${done?'done':''}" draggable="true"
    data-key="${dayKeyOf(it.type==='ev'?it.t.dueDateTime:it.t.deadline)}" data-ctx="${it.c.key}" data-tid="${it.t.id}" data-type="${it.type}"
    title="${esc(it.t.title)} (${esc(ctxLabel(it.c))})" onclick="openCardModal('${it.t.id}','${it.c.key}')">
    <span class="i-dot" style="background:${colr}"></span><span class="i-t">${time}</span><span class="i-x">${esc(it.t.title)}</span>
  </div>`;
}
function renderCalendar(){
  const el=$('#tabCalendar');
  const today=todayISO();
  let html=`<div class="cal-head">
    <div class="cal-mode">
      <button data-m="month" class="${calMode==='month'?'active':''}" onclick="setCalMode('month')">Месяц</button>
      <button data-m="week" class="${calMode==='week'?'active':''}" onclick="setCalMode('week')">Неделя</button>
      <button data-m="day" class="${calMode==='day'?'active':''}" onclick="setCalMode('day')">День</button>
    </div>
    <div class="cal-nav">
      <button onclick="calNav(-1)" title="Назад">‹</button>
      <button class="cal-title" onclick="calNav(0)" title="Сегодня">${calTitleText()}</button>
      <button onclick="calNav(1)" title="Вперёд">›</button>
    </div>
  </div>`;
  if(calMode==='month'){
    const y=calAnchor.getFullYear(),m=calAnchor.getMonth();
    const first=new Date(y,m,1);
    const start=(first.getDay()+6)%7;
    const dims=new Date(y,m+1,0).getDate();
    const total=Math.ceil((start+dims)/7)*7;
    html+=`<div class="cal-grid">`;
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w=>html+=`<div class="cal-wd">${w}</div>`);
    for(let i=0;i<total;i++){
      const d=i-start+1;
      if(d<1||d>dims){ html+='<div class="cal-cell other"></div>'; continue; }
      const key=y+'-'+pad(m+1)+'-'+pad(d);
      const items=calItemsFor(key);
      html+=`<div class="cal-cell ${key===today?'today':''}" data-key="${key}" onclick="openDayModal('${key}')">
        <div class="cn">${d}</div>`;
      items.slice(0,3).forEach(it=>html+=calItemHTML(it));
      if(items.length>3)html+=`<div class="cal-more">+ ещё ${items.length-3}</div>`;
      html+='</div>';
    }
    html+='</div>';
  } else if(calMode==='week'){
    const monday=new Date(calAnchor); monday.setDate(calAnchor.getDate()-((calAnchor.getDay()+6)%7));
    html+=`<div class="cal-grid">`;
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w=>html+=`<div class="cal-wd">${w}</div>`);
    for(let i=0;i<7;i++){
      const dd=new Date(monday); dd.setDate(monday.getDate()+i);
      const key=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
      const items=calItemsFor(key);
      html+=`<div class="cal-week-cell ${key===today?'today':''}" data-key="${key}" onclick="openDayModal('${key}')">
        <div class="cn">${fmtDate(key).slice(0,5)}</div>`;
      items.slice(0,5).forEach(it=>html+=calItemHTML(it));
      if(items.length>5)html+=`<div class="cal-more">+ ещё ${items.length-5}</div>`;
      html+='</div>';
    }
    html+='</div>';
  } else {
    const key=calAnchor.getFullYear()+'-'+pad(calAnchor.getMonth()+1)+'-'+pad(calAnchor.getDate());
    const items=calItemsFor(key);
    html+=`<div class="cal-day-list" data-key="${key}">`;
    if(!items.length)html+='<div class="today-empty">На этот день ничего нет.</div>';
    else items.forEach(it=>{
      const done=isDone(it.t);
      html+=`<div class="drow" onclick="openCardModal('${it.t.id}','${it.c.key}')">
        <span class="td-dot" style="background:${ctxColor(it.c)}"></span>
        <span class="td-time">${it.type==='ev'?fmtT(it.t.dueDateTime):'срок'}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${done?'text-decoration:line-through;color:var(--muted)':''}">${esc(it.t.title)} <span style="color:var(--muted)">· ${esc(ctxLabel(it.c))}</span></span>
      </div>`;
    });
    html+='</div>';
  }
  el.innerHTML=html;
  bindCalDnD();
}
function calTitleText(){
  if(calMode==='month')return MONTHS[calAnchor.getMonth()]+' '+calAnchor.getFullYear();
  if(calMode==='week')return 'Неделя';
  return calAnchor.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function setCalMode(m){ calMode=m; renderCalendar(); }
function calNav(dir){
  if(dir===0){ calAnchor=new Date(); }
  else if(calMode==='month'){ calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth()+dir,1); }
  else if(calMode==='week'){ calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth(),calAnchor.getDate()+dir*7); }
  else { calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth(),calAnchor.getDate()+dir); }
  renderCalendar();
}
function bindCalDnD(){
  document.querySelectorAll('.cal-item[draggable=true]').forEach(it=>{
    it.addEventListener('dragstart',e=>{
      dragEv={key:it.dataset.key,ctx:it.dataset.ctx,tid:it.dataset.tid,type:it.dataset.type};
      e.dataTransfer.effectAllowed='move';
    });
    it.addEventListener('dragend',()=>{ dragEv=null; document.querySelectorAll('.cal-cell,.cal-week-cell,.cal-day-list').forEach(x=>x.classList.remove('drag-over')); });
  });
  document.querySelectorAll('.cal-cell,.cal-week-cell,.cal-day-list').forEach(cell=>{
    cell.addEventListener('dragover',e=>{ e.preventDefault(); if(dragEv)cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
    cell.addEventListener('drop',e=>{
      e.preventDefault(); cell.classList.remove('drag-over');
      if(!dragEv||!cell.dataset.key)return;
      const ref=findTaskRef(dragEv.tid,dragEv.ctx);
      if(!ref)return;
      const tk=ref.t;
      const tgt=cell.dataset.key;
      if(dragEv.type==='ev'){
        const old=tk.dueDateTime||tgt+'T09:00';
        const timePart=old.length>=16?old.slice(11):'09:00';
        tk.dueDateTime=tgt+'T'+timePart;
      } else {
        tk.deadline=tgt;
      }
      save(); renderCalendar();
    });
  });
}
function openDayModal(key){
  const items=calItemsFor(key);
  const title=new Date(key+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  let rows='';
  if(!items.length)rows='<div class="log-empty">На этот день ничего не запланировано.</div>';
  else rows=items.map(it=>{
    const done=isDone(it.t);
    return `<div class="log-row" style="cursor:pointer" onclick="closeModal();openCardModal('${it.t.id}','${it.c.key}')">
      <span class="td-dot" style="background:${ctxColor(it.c)}"></span>
      <span class="log-dur">${it.type==='ev'?fmtT(it.t.dueDateTime):'срок'}</span>
      <span class="log-note" style="${done?'text-decoration:line-through;color:var(--muted)':''}">${esc(it.t.title)} <span style="color:var(--muted)">· ${esc(ctxLabel(it.c))}</span></span>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h3>${title.charAt(0).toUpperCase()+title.slice(1)}</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="log-block">${rows}</div>
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:12px" onclick="closeModal();openCardModal(null,${view.type==='ctx'?`'${view.key}'`:'null'},null,'${key}')">${ICON.plus} Добавить событие / задачу на этот день</button>
    </div>`);
}

/* ============================================================ REPORT */
function initReport(){
  const from=state._repFrom||firstOfMonth(), to=state._repTo||todayISO();
  $('#repFrom').value=from; $('#repTo').value=to;
  const ctxSel=$('#repCtx');
  let h='<option value="">Все разделы</option>';
  state.orgs.forEach(o=>{
    h+=`<option value="o:${o.id}">${o.general?'Общее':esc(o.name)+' (компания)'}</option>`;
    o.projects.forEach(p=>h+=`<option value="p:${p.id}">&nbsp;&nbsp;${esc(o.name)} — ${esc(p.name)}</option>`);
  });
  ctxSel.innerHTML=h;
  if(state._repCtx)ctxSel.value=state._repCtx;
  const respSel=$('#repResp');
  let rh='<option value="">Все</option>';
  [...new Set(allTasks().map(t=>t.responsible).filter(Boolean))].forEach(r=>rh+=`<option value="${esc(r)}">${esc(r)}</option>`);
  respSel.innerHTML=rh;
  if(state._repResp)respSel.value=state._repResp;
  const colSel=$('#repCol');
  let ch='<option value="">Все статусы</option>';
  state.columns.forEach(col=>ch+=`<option value="${col.id}">${esc(col.name)}</option>`);
  colSel.innerHTML=ch;
  if(state._repCol)colSel.value=state._repCol;
  if(typeof state._repEmpty==='boolean')$('#repEmpty').checked=state._repEmpty;
  else $('#repEmpty').checked=true;
  buildReport();
}
function firstOfMonth(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'; }
function setReportPreset(k){
  const now=new Date();
  const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  if(k==='today'){ $('#repFrom').value=fmt(now); $('#repTo').value=fmt(now); }
  else if(k==='week'){ const f=new Date(now); f.setDate(f.getDate()-6); $('#repFrom').value=fmt(f); $('#repTo').value=fmt(now); }
  else if(k==='month'){ $('#repFrom').value=firstOfMonth(); $('#repTo').value=fmt(now); }
  else if(k==='all'){ $('#repFrom').value='2000-01-01'; $('#repTo').value=fmt(now); }
  buildReport();
}
function repFilters(){
  return { from:$('#repFrom').value, to:$('#repTo').value, ctxKey:$('#repCtx').value,
    resp:$('#repResp').value, colId:$('#repCol').value, includeEmpty:$('#repEmpty').checked };
}
function filteredTasks(f){
  const fromMs=new Date(f.from+'T00:00:00').getTime();
  const toMs=new Date(f.to+'T23:59:59.999').getTime();
  let cList=contexts();
  if(f.ctxKey)cList=cList.filter(c=>c.key===f.ctxKey);
  const out=[];
  cList.forEach(c=>ctxTasks(c).forEach(t=>{
    if(f.resp&&(t.responsible||'')!==f.resp)return;
    if(f.colId&&t.columnId!==f.colId)return;
    out.push({c,t,fromMs,toMs});
  }));
  return out;
}
function taskSpent(t,fromMs,toMs){
  let spent=0,count=0;
  (t.intervals||[]).forEach(i=>{
    if(!i.end)return;
    const s=Math.max(i.start,fromMs),e=Math.min(i.end,toMs);
    if(e>s){ spent+=(e-s)/1000; count++; }
  });
  if(t.timer){
    const s=Math.max(t.timer.start,fromMs),e=Math.min(Date.now(),toMs);
    if(e>s){ spent+=(e-s)/1000; count++; }
  }
  return {spent:Math.floor(spent),count};
}
function reportRows(f){
  const rows=[];
  filteredTasks(f).forEach(({c,t})=>{
    const {spent,count}=taskSpent(t,f.fromMs,f.toMs);
    if(spent>0||f.includeEmpty)rows.push({c,t,spent,count,estimate:t.estimate,resp:t.responsible,status:colName(t.columnId)});
  });
  rows.sort((a,b)=>b.spent-a.spent);
  return rows;
}
function splitDays(fromMs,toMs){
  const res=[];
  const d=new Date(fromMs); d.setHours(0,0,0,0);
  let s=fromMs;
  while(s<toMs){
    const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
    const e=Math.min(next,toMs);
    if(e>s)res.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),ms:e-s});
    d.setDate(d.getDate()+1); s=next;
  }
  return res;
}
function chartData(f){
  const days={}, resp={}, ctxm={};
  filteredTasks(f).forEach(({c,t})=>{
    const ms=[];(t.intervals||[]).forEach(i=>{ if(i.end){ const s=Math.max(i.start,f.fromMs),e=Math.min(i.end,f.toMs); if(e>s)ms.push([s,e]); } });
    if(t.timer){ const s=Math.max(t.timer.start,f.fromMs),e=Math.min(Date.now(),f.toMs); if(e>s)ms.push([s,e]); }
    ms.forEach(([s,e])=>splitDays(s,e).forEach(d=>days[d.key]=(days[d.key]||0)+d.ms));
    const spent=ms.reduce((a,[s,e])=>a+(e-s),0)/1000;
    const respK=t.responsible||'(без ответственного)';
    resp[respK]=(resp[respK]||0)+spent;
    ctxm[ctxLabel(c)]=(ctxm[ctxLabel(c)]||0)+spent;
  });
  return {days,resp,ctx:ctxm};
}
function chartHTML(data){
  const mk=(title,obj,val)=>{
    const arr=Object.entries(obj).map(([k,v])=>({k,v:v})).sort((a,b)=>b.v-a.v).slice(0,7);
    if(!arr.length)return'';
    const max=arr[0].v;
    const rows=arr.map(a=>`<div class="crow"><span class="cl" title="${esc(a.k)}">${esc(a.k)}</span>
      <div class="ctr"><div class="cbar" style="width:${Math.max(4,a.v/max*100)}%"></div></div>
      <span class="cv">${fmtDur(a.v)}</span></div>`).join('');
    return `<div class="chart no-print"><h4>${title}</h4>${rows}</div>`;
  };
  return `<div class="charts">
    ${mk('Время по дням',data.days)}
    ${mk('Время по ответственным',data.resp)}
    ${mk('Время по разделам',data.ctx)}
  </div>`;
}
function buildReport(){
  const f=repFilters();
  if(!f.from||!f.to||f.from>f.to){ toast('Укажите корректный период','error'); return; }
  state._repFrom=f.from; state._repTo=f.to; state._repCtx=f.ctxKey; state._repResp=f.resp; state._repCol=f.colId; state._repEmpty=f.includeEmpty;
  f.fromMs=new Date(f.from+'T00:00:00').getTime(); f.toMs=new Date(f.to+'T23:59:59.999').getTime();
  const rows=reportRows(f);
  const body=$('#repBody');
  const totalSec=rows.reduce((s,r)=>s+r.spent,0);
  const totalCount=rows.reduce((s,r)=>s+r.count,0);
  const tasksWith=rows.filter(r=>r.spent>0).length;
  const summary=`<div class="rs">Период: <b>${fmtDate(f.from)} — ${fmtDate(f.to)}</b></div>
    <div class="rs">Задач с временем: <b>${tasksWith}</b></div>
    <div class="rs">Замеров: <b>${totalCount}</b></div>
    <div class="rs">Всего времени: <b>${fmtDur(totalSec)}</b></div>`;
  let html=`<div class="report-summary">${summary}</div>`;
  html+=chartHTML(chartData(f));
  if(!rows.length){ html+=`<div class="report-empty">За выбранный период нет данных.</div>`; body.innerHTML=html; return; }
  html+=`<table class="report-table"><thead><tr>
    <th style="width:34%">Задача</th><th>Ответственный</th><th>Статус</th><th>Приоритет</th>
    <th class="num">Оценка</th><th class="num">Замеров</th><th class="num">Время за период</th>
  </tr></thead><tbody>`;
  const grouped=new Map();
  rows.forEach(r=>{ if(!grouped.has(r.c.key))grouped.set(r.c.key,[]); grouped.get(r.c.key).push(r); });
  contexts().forEach(c=>{
    const gr=grouped.get(c.key); if(!gr)return;
    const sub=gr.reduce((s,r)=>s+r.spent,0);
    html+=`<tr class="ctx-head"><td colspan="7">${esc(ctxLabel(c))} <span style="font-weight:500;color:var(--muted)">· ${fmtDur(sub)}</span></td></tr>`;
    gr.forEach(r=>{
      const pr=PRIO[r.t.priority||'med'];
      html+=`<tr>
        <td><div class="t-title">${esc(r.t.title)}</div>${r.t.desc?`<div class="t-desc">${esc(r.t.desc)}</div>`:''}</td>
        <td class="t-resp">${esc(r.resp||'—')}</td>
        <td>${esc(r.status)}</td>
        <td style="color:${pr.color}">${pr.label}</td>
        <td class="num">${r.estimate?fmtDur(r.estimate*3600):'—'}</td>
        <td class="num">${r.count}</td>
        <td class="num"><b>${fmtDur(r.spent)}</b></td>
      </tr>`;
    });
  });
  html+=`<tr class="total"><td colspan="4">Итого</td><td class="num"></td><td class="num">${totalCount}</td><td class="num">${fmtDur(totalSec)}</td></tr>`;
  html+='</tbody></table>';
  body.innerHTML=html;
}
function reportCsv(){
  const f=repFilters();
  f.fromMs=new Date(f.from+'T00:00:00').getTime(); f.toMs=new Date(f.to+'T23:59:59.999').getTime();
  const rows=reportRows(f);
  let csv='\uFEFFРаздел;Задача;Что делали (описание);Ответственный;Приоритет;Статус;Оценка;Замеров;Время (чч:мм:сс)\n';
  rows.forEach(r=>{
    const dur=new Date(r.spent*1000).toISOString().substr(11,8);
    const q=s=>'"'+(s||'').replace(/"/g,'""')+'"';
    csv+=q(ctxLabel(r.c))+';'+q(r.t.title)+';'+q(r.t.desc)+';'+q(r.resp||'')+';'+q((PRIO[r.t.priority||'med']).label)+';'+q(r.status)+';'+q(r.estimate?fmtDur(r.estimate*3600):'')+';'+r.count+';'+dur+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='отчет-по-времени-'+f.from+'_'+f.to+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('CSV скачан');
}
function reportExcel(){
  const f=repFilters();
  f.fromMs=new Date(f.from+'T00:00:00').getTime(); f.toMs=new Date(f.to+'T23:59:59.999').getTime();
  const rows=reportRows(f);
  let t='<table border="1" cellpadding="4" cellspacing="0"><tr style="background:#eef0ff"><th>Раздел</th><th>Задача</th><th>Описание</th><th>Ответственный</th><th>Статус</th><th>Оценка</th><th>Замеров</th><th>Время (сек)</th><th>Время</th></tr>';
  rows.forEach(r=>{
    t+=`<tr><td>${esc(ctxLabel(r.c))}</td><td>${esc(r.t.title)}</td><td>${esc(r.t.desc||'')}</td><td>${esc(r.resp||'')}</td><td>${esc(r.status)}</td><td>${r.estimate?fmtDur(r.estimate*3600):''}</td><td>${r.count}</td><td>${r.spent}</td><td>${fmtDur(r.spent)}</td></tr>`;
  });
  t+='</table>';
  const htmlDoc=`<html><head><meta charset="utf-8"></head><body>${t}</body></html>`;
  const blob=new Blob(['\uFEFF'+htmlDoc],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='отчет-по-времени-'+f.from+'_'+f.to+'.xls';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Excel скачан');
}
function reportPdf(){ window.print(); }

/* ============================================================ export/import */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download='канбан-бэкап-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Резервная копия скачана');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const s=JSON.parse(reader.result);
      if(!s.columns||!Array.isArray(s.columns)||!Array.isArray(s.orgs))throw new Error('bad');
      if(!confirm('Импорт заменит текущие данные. Продолжить?'))return;
      state=normalize(s);
      view={type:'all'};
      save(); applyTheme(); render();
      toast('Данные загружены из файла','ok');
    }catch(e){ toast('Не удалось прочитать файл','error'); }
  };
  reader.readAsText(file);
}

/* ============================================================ stats */
function renderStats(runningCount){
  const el=$('#stats');
  if(!el)return;
  const all=allTasks();
  const overdue=all.filter(isOverdue);
  const today=all.filter(isToday);
  const eventsToday=all.filter(t=>t.dueDateTime&&dayKeyOf(t.dueDateTime)===todayISO()).length;
  const spentTotal=all.reduce((s,t)=>s+totalSpent(t),0);
  const running=runningCount!==undefined?runningCount:all.filter(t=>t.timer).length;
  el.innerHTML=`
    <span class="stat"><b>${all.length}</b> задач</span>
    <span class="stat danger"><b>${overdue.length}</b> просрочено</span>
    <span class="stat warn"><b>${today.length}</b> срок сегодня</span>
    <span class="stat warn"><b>${eventsToday}</b> событий сегодня</span>
    <span class="stat ${running?'running':''}"><b>${running}</b> ${running===1?'таймер':(running>=2&&running<=4?'таймера':'таймеров')}</span>
    <span class="stat"><b>${fmtDur(spentTotal)}</b> всего</span>`;
}

/* ============================================================ render */
function render(){
  renderProjects();
  renderTabs();
  renderStats();
  if(currentTab==='board'){ renderToolbar(); renderBoard(); }
  else if(currentTab==='today')renderToday();
  else if(currentTab==='calendar')renderCalendar();
  else if(currentTab==='report')initReport();
  refreshTimerLabels();
}

document.addEventListener('DOMContentLoaded',()=>{
  $('#btnNewOrg').onclick=()=>openOrgModal(null);
  $('#btnNewOrg2').onclick=()=>openOrgModal(null);
  $('#btnColumns').onclick=openColumnsModal;
  $('#btnExport').onclick=exportData;
  $('#btnImport').onclick=()=>$('#importFile').click();
  $('#btnSound').onclick=toggleSound;
  $('#btnBell').onclick=enableNotifs;
  $('#btnTheme').onclick=toggleTheme;
  $('#btnLogin').onclick=signIn;
  document.querySelectorAll('#tabs button').forEach(b=>{ b.onclick=()=>setTab(b.dataset.t); });
  $('#repBuild').onclick=buildReport;
  $('#repExcel').onclick=reportExcel;
  $('#repPdf').onclick=reportPdf;
  document.querySelectorAll('.preset-btn').forEach(b=>{ b.onclick=()=>setReportPreset(b.dataset.r); });
  $('#importFile').addEventListener('change',e=>{ if(e.target.files[0])importData(e.target.files[0]); e.target.value=''; });
  $('#searchInput').addEventListener('input',e=>{ search=e.target.value; render(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
  if('Notification' in window&&Notification.permission==='granted'&&!state.settings.notifications)state.settings.notifications=true;
  applyTheme();
  updateHeader();
  render();
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  }
  initAuth();
});
